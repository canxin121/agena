# Keep the platform's default unwind tables. On macOS, -no_compact_unwind
# makes even catch_unwind abort with "failed to initiate panic, error 5".
# A large debug binary's compact-unwind warning does not justify disabling
# panic recovery for the entire workspace and its dependencies.

# Debug builds of the session reply chain (resolve_pending_tool ->
# apply_tool_success -> persist) measure over 2 MiB of async worker stack, so
# production debug binaries run tokio workers on 8 MiB stacks (see
# APP_RUNTIME_THREAD_STACK_SIZE in crates/agena-runtime/src/lib.rs).
# `cargo test` binaries skip main() and inherit tokio's default 2 MiB worker
# stack, which the hook-activity drain pushes just over. Raise the default for
# every cargo-invoked process so tests run at the production debug stack
# budget instead of crashing with `has overflowed its stack`.
[env]
RUST_MIN_STACK = "8388608"

[alias]
# Ordinary libtest targets; bound concurrent product processes on developer/CI hosts.
test-bundled = "test -p agena --test bundled_plugins -- --test-threads=2"
test-system = "test -p agena --test system -- --test-threads=2"
test-control = "test -p agena --test system scenarios::control -- --test-threads=2"
test-clock = "test -p agena --test system scenarios::clock -- --test-threads=2"
test-faults = "test -p agena --test system -- --test-threads=2 scenarios::control scenarios::fault_lifecycle"
test-native = "test -p agena --test system scenarios::native -- --test-threads=2"
# Exercise every Rust library's retained contract tests without re-running the
# longer product system and bundled integration suites.
test-libs = "test --workspace --lib --locked -- --test-threads=2"
