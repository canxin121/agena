name: Agena Release
run-name: Agena Release ${{ inputs.tag_name || inputs.source_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name, for example agena-v0.1.0"
        required: false
        type: string
      source_sha:
        description: "Commit SHA to build; defaults to the selected workflow ref"
        required: false
        type: string
      publish_release:
        description: "Create or update a GitHub release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: agena-release-${{ inputs.tag_name || inputs.source_sha || github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  AGENA_WEB_DIST_PREBUILT: "1"

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
      publish_release: ${{ steps.meta.outputs.publish_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - id: meta
        env:
          REQUESTED_TAG: ${{ inputs.tag_name }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --format-version 1 --no-deps --locked | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "agena"))')"
          if [[ -z "$version" ]]; then
            echo "failed to read version from Cargo.toml" >&2
            exit 1
          fi

          tag="$REQUESTED_TAG"
          if [[ -z "$tag" ]]; then
            tag="agena-v${version}"
          fi
          if [[ "$tag" != "agena-v${version}" ]]; then
            echo "tag $tag does not match agena version $version" >&2
            exit 1
          fi

          source_sha="$(git rev-parse HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "publish_release=$PUBLISH_RELEASE" >> "$GITHUB_OUTPUT"

  targets:
    name: Load universal release target manifest
    needs: metadata
    runs-on: ubuntu-latest
    outputs:
      cross_backend: ${{ steps.matrix.outputs.cross_backend }}
      native: ${{ steps.matrix.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.0
      - name: Verify universal target coverage
        run: python3 scripts/agena/verify-target-coverage.py
      - name: Verify runtime crypto/auth capabilities
        run: python3 scripts/ci/verify-runtime-capabilities.py
      - id: matrix
        shell: bash
        run: |
          set -euo pipefail
          cross_backend="$(python3 scripts/agena/target-matrix.py cross-backend --compact)"
          native="$(python3 scripts/agena/target-matrix.py native-backend --compact)"
          echo "cross_backend=$cross_backend" >> "$GITHUB_OUTPUT"
          echo "native=$native" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json
          data = json.load(open("scripts/agena/universal-targets.json", encoding="utf-8"))
          print(f"Cross backend targets: {len(data['cross_backend'])}")
          print(f"Native/SDK backend targets: {len(data['native_backend'])}")
          PY

  web:
    name: Build Agena Web once
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            packages/agena-web/node_modules
          key: agena-web-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version', 'packages/agena-web/bun.lock') }}
      - name: Install Web dependencies
        working-directory: packages/agena-web
        run: bun install --frozen-lockfile
      - name: Build Web frontend
        working-directory: packages/agena-web
        run: bun run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agena-web-dist-internal
          path: packages/agena-web/dist
          if-no-files-found: error
          retention-days: 1

  cross-tool:
    name: Build pinned cross tool
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.0
      - name: Build cross
        run: |
          set -euo pipefail
          cargo install cross \
            --git https://github.com/cross-rs/cross \
            --rev c5c9de4a8f54ed3f40c0ca9f9cc8be60c4bc4019 \
            --locked \
            --root "$RUNNER_TEMP/cross"
          "$RUNNER_TEMP/cross/bin/cross" --version || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-linux-x86_64-internal
          path: ${{ runner.temp }}/cross/bin/cross
          if-no-files-found: error
          retention-days: 1

  hosted-backend:
    name: release ${{ matrix.target }}
    needs:
      - metadata
      - targets
      - web
      - cross-tool
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.targets.outputs.cross_backend) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.0
      - name: Install nightly rust-src for build-std targets
        if: matrix.build_std
        run: rustup toolchain install nightly-2026-08-18 --profile minimal --component rust-src
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agena-web-dist-internal
          path: packages/agena-web/dist
      - name: Restore Cargo source cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: universal-release-sources
          key: hosted
          cache-targets: false
          cache-on-failure: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cross-linux-x86_64-internal
          path: ${{ runner.temp }}/cross/bin
      - name: Install cross tool
        run: |
          chmod +x "$RUNNER_TEMP/cross/bin/cross"
          echo "$RUNNER_TEMP/cross/bin" >> "$GITHUB_PATH"
      - name: Build and package target
        run: >-
          bash scripts/agena/package-cross-backend.sh
          '${{ matrix.target }}'
          '${{ matrix.build_std }}'
          '${{ matrix.artifact_kind }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agena-release-${{ matrix.target }}
          path: |
            artifacts/agena/*.tar.gz
            artifacts/agena/*.zip
            artifacts/agena/*.sha256
          if-no-files-found: error

  native-backend:
    name: release ${{ matrix.target }}
    needs:
      - metadata
      - targets
      - web
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.native) }}
    env:
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: agena-v1
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.0
          components: rust-src
      - name: Install distributed target component
        if: ${{ !matrix.build_std }}
        shell: bash
        run: rustup target add '${{ matrix.target }}' --toolchain 1.97.0
      - name: Install nightly Cargo driver
        if: matrix.build_std
        shell: bash
        run: rustup toolchain install nightly-2026-08-18 --profile minimal
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - name: Configure Cargo sccache wrapper
        uses: ./.github/actions/configure-sccache-wrapper
      - name: Restore Cargo dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust-sccache
          key: universal-release-${{ matrix.target }}
          cache-bin: false
          cache-on-failure: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agena-web-dist-internal
          path: packages/agena-web/dist
      - name: Build Backend Package (Unix)
        if: matrix.shell == 'bash'
        shell: bash
        run: >-
          bash scripts/agena/package-backend.sh
          '${{ matrix.target }}'
          '${{ matrix.build_std }}'
          '${{ matrix.rustflags || '' }}'
      - name: Build Backend Package (Windows)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: >-
          ./scripts/agena/package-backend.ps1
          -TargetTriple '${{ matrix.target }}'
          -BuildStd $${{ matrix.build_std }}
          -TargetRustFlags '${{ matrix.rustflags || '' }}'
      - name: Verify sccache compiler activity
        uses: ./.github/actions/verify-sccache
        with:
          label: release-${{ matrix.target }}
          minimum-requests: "0"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agena-release-${{ matrix.target }}
          path: |
            artifacts/agena/*.tar.gz
            artifacts/agena/*.zip
            artifacts/agena/*.sha256
          if-no-files-found: error

  verify-assets:
    name: Verify complete release asset set
    if: >-
      always() &&
      needs.hosted-backend.result == 'success' &&
      needs.native-backend.result == 'success'
    needs:
      - metadata
      - hosted-backend
      - native-backend
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agena-release-*
          path: release-assets
          merge-multiple: true
      - name: Verify exact target archives and SHA256 files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY'
          import json
          import os
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          manifest = json.load(open("scripts/agena/universal-targets.json", encoding="utf-8"))
          expected = set()

          for group in ("cross_backend", "native_backend"):
              for row in manifest[group]:
                  target = row["target"]
                  ext = "zip" if "windows" in target else "tar.gz"
                  expected.add(f"agena-backend-{target}-v{version}.{ext}")

          root = Path("release-assets")
          actual = {
              path.name
              for path in root.rglob("*")
              if path.is_file() and (path.name.endswith(".tar.gz") or path.name.endswith(".zip"))
          }
          checksum_files = {path.name for path in root.rglob("*.sha256") if path.is_file()}
          expected_checksums = {f"{name}.sha256" for name in expected}

          missing = sorted(expected - actual)
          extra = sorted(actual - expected)
          missing_checksums = sorted(expected_checksums - checksum_files)
          extra_checksums = sorted(checksum_files - expected_checksums)
          if missing or extra or missing_checksums or extra_checksums:
              if missing:
                  print("Missing archives:", *missing, sep="\n  ")
              if extra:
                  print("Unexpected archives:", *extra, sep="\n  ")
              if missing_checksums:
                  print("Missing checksum files:", *missing_checksums, sep="\n  ")
              if extra_checksums:
                  print("Unexpected checksum files:", *extra_checksums, sep="\n  ")
              raise SystemExit(1)

          print(f"Verified exact release archive set: {len(expected)} targets")

          def normalized_member(name):
              while name.startswith("./"):
                  name = name[2:]
              return name.rstrip("/")

          def archive_members(path):
              if path.suffix == ".zip":
                  import zipfile

                  with zipfile.ZipFile(path) as archive:
                      return {
                          normalized_member(info.filename): info.file_size
                          for info in archive.infolist()
                          if not info.is_dir()
                      }

              import tarfile

              with tarfile.open(path, "r:gz") as archive:
                  return {
                      normalized_member(info.name): info.size
                      for info in archive.getmembers()
                      if info.isfile()
                  }

          bad_contents = []
          for archive_name in sorted(expected):
              archive_path = next(root.rglob(archive_name))
              target = archive_name.removeprefix("agena-backend-").split("-v", 1)[0]
              executable = "bin/agena.exe" if "windows" in target else "bin/agena"
              required = {executable, "web-dist/index.html"}
              members = archive_members(archive_path)
              missing_members = sorted(member for member in required if member not in members)
              empty_members = sorted(member for member in required if member in members and members[member] <= 0)
              if missing_members or empty_members:
                  bad_contents.append(
                      {
                          "archive": archive_name,
                          "missing": missing_members,
                          "empty": empty_members,
                      }
                  )

          if bad_contents:
              for failure in bad_contents:
                  print(f"Invalid archive contents: {failure}")
              raise SystemExit(1)

          print("Verified executable and web frontend contents for every archive")
          PY_VERIFY
          (
            cd release-assets
            for checksum in *.sha256; do
              sha256sum -c "$checksum"
            done
          )

  publish:
    if: >-
      always() &&
      needs.metadata.outputs.publish_release == 'true' &&
      needs.verify-assets.result == 'success'
    needs:
      - metadata
      - verify-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agena-release-*
          path: release-assets
          merge-multiple: true
      - name: Add one-click installers to release assets
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/agena/install.sh release-assets/install.sh
          cp scripts/agena/install.ps1 release-assets/install.ps1
          chmod +x release-assets/install.sh
          (
            cd release-assets
            sha256sum install.sh > install.sh.sha256
            sha256sum install.ps1 > install.ps1.sha256
          )
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: Agena ${{ needs.metadata.outputs.version }}
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ needs.metadata.outputs.source_sha }}
          prerelease: ${{ contains(needs.metadata.outputs.version, '-') }}
          generate_release_notes: true
          files: release-assets/*

  installer-smoke:
    name: Published installer smoke (${{ matrix.name }})
    if: always() && needs.publish.result == 'success'
    needs:
      - metadata
      - publish
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
            shell_kind: bash
          - name: macOS arm64
            runner: macos-15
            shell_kind: bash
          - name: Windows x86_64
            runner: windows-latest
            shell_kind: pwsh
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      TEST_PORT: "43220"
    steps:
      - name: Smoke published installer (Unix)
        if: matrix.shell_kind == 'bash'
        shell: bash
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/install.sh"
          install_dir="$RUNNER_TEMP/agena-install"
          workspace="$RUNNER_TEMP/agena-workspace"
          mkdir -p "$workspace"
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/install.sh" \
            -o "$installer"
          chmod +x "$installer"

          bash "$installer" install \
            --repo "$GITHUB_REPOSITORY" \
            --version "$RELEASE_VERSION" \
            --install-dir "$install_dir" \
            --workspace "$workspace" \
            --port "$TEST_PORT" \
            --service-mode detached \
            --no-path-update
          bash "$installer" status --install-dir "$install_dir" --no-path-update
          curl --retry 20 --retry-delay 1 --retry-connrefused -fsS "http://127.0.0.1:${TEST_PORT}/api/v1/health" >/dev/null
          bash "$installer" stop --install-dir "$install_dir" --no-path-update
          bash "$installer" start --install-dir "$install_dir" --no-path-update
          curl --retry 20 --retry-delay 1 --retry-connrefused -fsS "http://127.0.0.1:${TEST_PORT}/api/v1/health" >/dev/null
          bash "$installer" upgrade \
            --repo "$GITHUB_REPOSITORY" \
            --version "$RELEASE_VERSION" \
            --install-dir "$install_dir" \
            --no-path-update
          bash "$installer" uninstall --install-dir "$install_dir" --no-path-update
          test ! -e "$install_dir"

      - name: Smoke published installer (Windows)
        if: matrix.shell_kind == 'pwsh'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'install.ps1'
          $installDir = Join-Path $env:RUNNER_TEMP 'agena-install'
          $workspace = Join-Path $env:RUNNER_TEMP 'agena-workspace'
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null

          $installerUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/install.ps1"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              Invoke-WebRequest -Uri $installerUrl -OutFile $installer -Headers @{ 'User-Agent' = 'agena-release-smoke' }
              break
            } catch {
              if ($attempt -eq 5) { throw }
              Start-Sleep -Seconds (2 * $attempt)
            }
          }

          & $installer -Action Install `
            -Repo $env:GITHUB_REPOSITORY `
            -Version $env:RELEASE_VERSION `
            -InstallDir $installDir `
            -Workspace $workspace `
            -Port ([int]$env:TEST_PORT) `
            -ServiceMode detached `
            -NoPathUpdate
          & $installer -Action Status -InstallDir $installDir -NoPathUpdate
          Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$env:TEST_PORT/api/v1/health" | Out-Null
          & $installer -Action Stop -InstallDir $installDir -NoPathUpdate
          & $installer -Action Start -InstallDir $installDir -NoPathUpdate
          Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$env:TEST_PORT/api/v1/health" | Out-Null
          & $installer -Action Upgrade `
            -Repo $env:GITHUB_REPOSITORY `
            -Version $env:RELEASE_VERSION `
            -InstallDir $installDir `
            -NoPathUpdate
          & $installer -Action Uninstall -InstallDir $installDir -NoPathUpdate
          if (Test-Path -LiteralPath $installDir) { throw 'published installer uninstall left files behind' }

      - name: Cleanup published installer smoke (Unix)
        if: always() && matrix.shell_kind == 'bash'
        shell: bash
        run: |
          installer="$RUNNER_TEMP/install.sh"
          install_dir="$RUNNER_TEMP/agena-install"
          if [[ -f "$installer" && -d "$install_dir" ]]; then
            bash "$installer" uninstall --install-dir "$install_dir" --no-path-update >/dev/null 2>&1 || true
          fi

      - name: Cleanup published installer smoke (Windows)
        if: always() && matrix.shell_kind == 'pwsh'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'install.ps1'
          $installDir = Join-Path $env:RUNNER_TEMP 'agena-install'
          if ((Test-Path -LiteralPath $installer) -and (Test-Path -LiteralPath $installDir)) {
            try { & $installer -Action Uninstall -InstallDir $installDir -NoPathUpdate *> $null } catch {}
          }
          Get-Process agena -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
