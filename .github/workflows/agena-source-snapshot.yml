name: Agena Source Snapshot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Package complete repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agena-package
          git bundle create /tmp/agena-package/agena.git.bundle --all
          tar --exclude='./agena-repository.tar.gz' -czf /tmp/agena-package/agena-repository.tar.gz .

      - name: Upload repository archive
        uses: actions/upload-artifact@v4
        with:
          name: agena-repository-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/agena-package/agena-repository.tar.gz
            /tmp/agena-package/agena.git.bundle
          if-no-files-found: error
          compression-level: 0
