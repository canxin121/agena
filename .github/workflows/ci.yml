name: Universal target diagnostic
run-name: Universal target diagnostic ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  targets:
    name: Load hosted target manifest
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      native: ${{ steps.matrix.outputs.native }}
      portable: ${{ steps.matrix.outputs.portable }}
      portable_build_std: ${{ steps.matrix.outputs.portable_build_std }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.0
      - name: Verify universal target coverage
        run: python3 scripts/agena/verify-target-coverage.py
      - id: matrix
        name: Render hosted target matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(python3 scripts/agena/target-matrix.py hosted-cross --compact)"
          native="$(python3 scripts/agena/target-matrix.py native --compact)"
          portable="$(python3 scripts/agena/target-matrix.py portable --compact)"
          portable_build_std="$(python3 scripts/agena/target-matrix.py portable-build-std --compact)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "portable=$portable" >> "$GITHUB_OUTPUT"
          echo "portable_build_std=$portable_build_std" >> "$GITHUB_OUTPUT"
          python3 - <<'PY_MATRIX'
          import json
          data = json.load(open("scripts/agena/universal-targets.json", encoding="utf-8"))
          print(f"Loaded {len(data['hosted_cross'])} hosted target definitions")
          print(f"Loaded {len(data['native'])} native target definitions")
          print(f"Loaded {len(data['portable'])} distributed portable target definitions")
          print(f"Loaded {len(data['portable_build_std'])} build-std portable target definitions")
          PY_MATRIX

  cross-tool:
    name: Build pinned cross tool
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.0
      - name: Build cross
        run: |
          cargo install cross \
            --git https://github.com/cross-rs/cross \
            --rev c5c9de4a8f54ed3f40c0ca9f9cc8be60c4bc4019 \
            --locked \
            --root "$RUNNER_TEMP/cross"
          "$RUNNER_TEMP/cross/bin/cross" --version || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-linux-x86_64
          path: ${{ runner.temp }}/cross/bin/cross
          if-no-files-found: error
          retention-days: 1

  hosted-targets:
    name: check ${{ matrix.target }}
    needs:
      - targets
      - cross-tool
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.0
      - name: Install nightly rust-src for build-std targets
        if: matrix.build_std
        run: rustup toolchain install nightly-2026-08-18 --profile minimal --component rust-src
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cross-linux-x86_64
          path: ${{ runner.temp }}/cross/bin
      - name: Install cross tool
        run: |
          chmod +x "$RUNNER_TEMP/cross/bin/cross"
          echo "$RUNNER_TEMP/cross/bin" >> "$GITHUB_PATH"
      - name: Restore Cargo source cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: universal-target-check
          key: ${{ matrix.target }}
          cache-targets: false
          cache-on-failure: true
      - name: Check target
        run: bash scripts/ci/cross-check-target.sh '${{ matrix.target }}' '${{ matrix.build_std }}' '${{ matrix.artifact_kind }}'

  native-targets:
    name: native ${{ matrix.target }}
    needs: targets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.native) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      - name: Check native target
        run: cargo check -p agena --target '${{ matrix.target }}' --locked

  portable-targets:
    name: portable ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix: ${{ fromJSON(needs.targets.outputs.portable) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      - name: Build portable core
        run: cargo build -p agena-portable-core --release --target '${{ matrix.target }}' --locked

  portable-build-std-targets:
    name: build-std portable ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix: ${{ fromJSON(needs.targets.outputs.portable_build_std) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.0
          components: rust-src
      - name: Install nightly Cargo driver
        run: rustup toolchain install nightly-2026-08-18 --profile minimal
      - name: Build target core from Rust 1.97 sources
        shell: bash
        run: >-
          bash scripts/agena/package-portable-core.sh
          '${{ matrix.target }}'
          true
          '${{ matrix.rustflags }}'
