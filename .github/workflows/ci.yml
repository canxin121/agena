name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sccache-wrapper-probe:
    name: sccache wrapper probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            shell: bash
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            shell: pwsh
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: agena-v1
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 067b8be5c0775f0877a2f8c3a837fe895afdf059
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.0

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Configure absolute sccache wrapper (Unix)
        if: matrix.shell == 'bash'
        shell: bash
        run: |
          set -euo pipefail
          [[ -x "$SCCACHE_PATH" ]]
          printf 'RUSTC_WRAPPER=%s\n' "$SCCACHE_PATH" >> "$GITHUB_ENV"
          printf 'resolved_sccache=%s\n' "$(command -v sccache)"
          "$SCCACHE_PATH" --version
          "$SCCACHE_PATH" --zero-stats

      - name: Configure absolute sccache wrapper (Windows)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $wrapper = $env:SCCACHE_PATH
          if (-not (Test-Path -LiteralPath $wrapper)) {
            $wrapper = "$wrapper.exe"
          }
          if (-not (Test-Path -LiteralPath $wrapper)) {
            throw "sccache executable not found at $wrapper"
          }
          "RUSTC_WRAPPER=$wrapper" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "resolved_sccache=$((Get-Command sccache).Source)"
          & $wrapper --version
          & $wrapper --zero-stats

      - name: Build probe crate (Unix)
        if: matrix.shell == 'bash'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target/sccache-probe
          cargo build \
            -p agena-failure \
            --release \
            --locked \
            --target "${{ matrix.target }}" \
            --target-dir target/sccache-probe
          "$SCCACHE_PATH" --show-stats

      - name: Build probe crate (Windows)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath target/sccache-probe) {
            Remove-Item -LiteralPath target/sccache-probe -Recurse -Force
          }
          cargo build `
            -p agena-failure `
            --release `
            --locked `
            --target "${{ matrix.target }}" `
            --target-dir target/sccache-probe
          if ($LASTEXITCODE -ne 0) {
            throw "cargo build probe failed"
          }
          & $env:RUSTC_WRAPPER --show-stats
