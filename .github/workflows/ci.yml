name: CI

on:
  # Automatic push/PR runs are disabled while GitHub Actions billing is
  # unavailable. Keep the workflow manually runnable without deleting its
  # checks so the automatic triggers can be restored in one small change.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.0
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    env:
      # Use portable compiler outputs instead of runner-local Cargo incremental state.
      CARGO_INCREMENTAL: "0"
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: agena-v1
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.0
          components: clippy
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Configure Cargo sccache wrapper
        uses: ./.github/actions/configure-sccache-wrapper

      - name: Restore Cargo dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust-sccache
          cache-bin: false
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: regression tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: agena-v1
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.0
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Configure Cargo sccache wrapper
        uses: ./.github/actions/configure-sccache-wrapper

      - name: Restore Cargo dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust-sccache
          cache-bin: false
          cache-on-failure: true
      - name: failure semantics architecture gate
        run: python3 scripts/refactors/check-refactor-invariants.py --manifest scripts/refactors/failure-semantics-invariants.json --root .
      - run: cargo check --workspace --locked
      - name: capability identity snapshot drift
        run: cargo test -p agena-bundled-plugins capability_identity_snapshot_matches_committed_json --locked
      - run: cargo test --workspace --locked
      - run: cargo test -p agena-e2e --locked
      - run: cargo test -p agena --locked git_
      - name: build examples
        run: |
          cargo build --manifest-path examples/echo_plugin/Cargo.toml --locked
          cargo build --manifest-path examples/echo_plugin_stdio/Cargo.toml --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources advisories

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # rsa is present only behind sqlx-mysql, which Agena does not enable.
          ignore: "RUSTSEC-2023-0071"

  lockfile:
    name: lockfile freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.0
      - run: cargo update --workspace --locked

  unused-dependencies:
    name: unused Cargo dependencies
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: agena-v1
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.0
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Configure Cargo sccache wrapper
        uses: ./.github/actions/configure-sccache-wrapper

      - name: Restore Cargo tool cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust-sccache
          key: cargo-machete-0.9.2
          cache-all-crates: true
          cache-on-failure: true
      - run: cargo install cargo-machete --version 0.9.2 --locked
      - run: cargo machete

  feature-checks:
    name: feature checks
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: agena-v1
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.0
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Configure Cargo sccache wrapper
        uses: ./.github/actions/configure-sccache-wrapper

      - name: Restore Cargo dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust-sccache
          cache-bin: false
          cache-on-failure: true
      - run: cargo check -p agena-marketplace-server --features server --locked
      - run: cargo check -p agena-plugin-host --all-features --locked
      - run: cargo check -p agena-runtime --all-features --locked
      - run: cargo check -p agena-api-server --all-features --locked
      - run: cargo check -p agena-cli --all-features --locked
