name: Universal target diagnostic
run-name: Universal target diagnostic ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  cross-tool:
    name: Build pinned cross tool
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.0
      - name: Build cross
        run: |
          cargo install cross \
            --git https://github.com/cross-rs/cross \
            --rev c5c9de4a8f54ed3f40c0ca9f9cc8be60c4bc4019 \
            --locked \
            --root "$RUNNER_TEMP/cross"
          "$RUNNER_TEMP/cross/bin/cross" --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-linux-x86_64
          path: ${{ runner.temp }}/cross/bin/cross
          if-no-files-found: error
          retention-days: 1

  representative-targets:
    name: check ${{ matrix.target }}
    needs: cross-tool
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - i686-unknown-linux-gnu
          - loongarch64-unknown-linux-gnu
          - mipsel-unknown-linux-gnu
          - powerpc64le-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - s390x-unknown-linux-gnu
          - aarch64-linux-android
          - i686-linux-android
          - x86_64-pc-windows-gnu
          - x86_64-unknown-freebsd
          - x86_64-unknown-netbsd
          - x86_64-unknown-illumos
          - sparcv9-sun-solaris
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cross-linux-x86_64
          path: ${{ runner.temp }}/cross/bin
      - name: Install cross tool
        run: |
          chmod +x "$RUNNER_TEMP/cross/bin/cross"
          echo "$RUNNER_TEMP/cross/bin" >> "$GITHUB_PATH"
      - name: Restore Cargo source cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: universal-target-check
          key: ${{ matrix.target }}
          cache-targets: false
          cache-on-failure: true
      - name: Check target
        run: bash scripts/ci/cross-check-target.sh '${{ matrix.target }}'
