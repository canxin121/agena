name: Reusable Plugin CI

on:
  workflow_call:
    inputs:
      agena_ref:
        description: Exact Agena git revision providing the SDK and developer tool
        required: true
        type: string
      manifest_path:
        description: Agena plugin project manifest
        required: false
        type: string
        default: agena-plugin.toml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: agena-plugin-v1
          cache-on-failure: true

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Install Agena plugin developer tool
        env:
          AGENA_REF: ${{ inputs.agena_ref }}
        run: >-
          cargo install --locked
          --git https://github.com/canxin121/agena
          --rev "$AGENA_REF"
          agena-plugin-dev

      - name: Validate plugin project
        run: agena-plugin validate "${{ inputs.manifest_path }}"
