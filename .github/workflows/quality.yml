name: Agena quality

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agena-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: agena-quality-v1
          cache-on-failure: true
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Lint optional plugin features
        run: cargo clippy --locked -p agena-plugin-host --all-targets --all-features -- -D warnings
      - name: Verify runtime crypto and auth
        run: python3 scripts/ci/verify-runtime-capabilities.py
      - name: Ensure builds leave tracked sources unchanged
        run: git diff --exit-code

  system-tests:
    name: Rust system tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: agena-system-tests-v1
          cache-on-failure: true
      - name: Prepare fixture artifact directory
        run: mkdir -p "$RUNNER_TEMP/agena-test-artifacts"
      - name: Test all workspace library contracts
        env:
          TMPDIR: ${{ runner.temp }}/agena-test-artifacts
        run: cargo test-libs
      - name: Test plugin SDK transports
        env:
          TMPDIR: ${{ runner.temp }}/agena-test-artifacts
        run: cargo test --locked -p agena-plugin-sdk --lib --features http,stdio -- --test-threads=2
      - name: Test product binary terminal cleanup contract
        env:
          TMPDIR: ${{ runner.temp }}/agena-test-artifacts
        run: cargo test --locked -p agena --bin agena tmux_cleanup_contract_tests -- --test-threads=1
      - name: Test real Agena sessions
        env:
          TMPDIR: ${{ runner.temp }}/agena-test-artifacts
        run: cargo --locked test-system
      - name: Test all bundled plugins
        env:
          TMPDIR: ${{ runner.temp }}/agena-test-artifacts
        run: cargo --locked test-bundled
      - name: Preserve failed case diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agena-system-test-diagnostics
          path: ${{ runner.temp }}/agena-test-artifacts/agena-testkit-*/diagnostics/**
          if-no-files-found: ignore
          retention-days: 7

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/agena-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build and check types, imports, and translations
        run: bun run build
      - name: Audit dependencies
        run: bun audit
      - name: Ensure the lockfile remains unchanged
        run: git diff --exit-code

  scripts:
    name: Repository tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Test refactor tools
        run: python3 -m unittest discover -s scripts/refactors/tests
      - name: Check architecture invariants
        run: python3 scripts/refactors/check-refactor-invariants.py --manifest scripts/refactors/failure-semantics-invariants.json
      - name: Validate dependency script
        run: bash -n scripts/dependencies/check.sh
