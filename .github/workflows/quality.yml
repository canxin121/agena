name: Agena quality

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agena-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: agena-quality-v1
          cache-on-failure: true
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test workspace
        run: cargo test --workspace --locked --no-fail-fast
      - name: Test scheduler independently
        run: cargo test --locked -p agena-scheduler
      - name: Test optional plugin features independently and together
        run: |
          cargo test --locked -p agena-plugin-host --features signing
          cargo test --locked -p agena-plugin-host --features wasm
          cargo test --locked -p agena-plugin-host --all-features
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Lint optional plugin features
        run: cargo clippy --locked -p agena-plugin-host --all-targets --all-features -- -D warnings
      - name: Verify runtime crypto and auth
        run: python3 scripts/ci/verify-runtime-capabilities.py
      - name: Verify plugin panic isolation in the shipping profile
        run: cargo run --locked -p agena-plugin-host --profile dist --example panic_isolation
      - name: Ensure builds leave tracked sources unchanged
        run: git diff --exit-code

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/agena-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun test
      - name: Build and check types, imports, and translations
        run: bun run build
      - name: Audit dependencies
        run: bun audit
      - name: Ensure the lockfile remains unchanged
        run: git diff --exit-code

  scripts:
    name: Repository tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Test refactor tools
        run: python3 -m unittest discover -s scripts/refactors/tests
      - name: Check architecture invariants
        run: python3 scripts/refactors/check-refactor-invariants.py --manifest scripts/refactors/failure-semantics-invariants.json
      - name: Validate dependency script
        run: bash -n scripts/dependencies/check.sh
