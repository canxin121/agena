[workspace]
resolver = "3"
members = [
    "apps/agena-cli",
    "apps/agena-studio-desktop/src-tauri",
    "apps/agena-studio-desktop/src-tauri-cef",
    "apps/agena-studio-server",
    "apps/agena-tui",
    "crates/agena",
    "crates/agena-api",
    "crates/agena-api-server",
    "crates/agena-client",
    "crates/agena-keyring-store",
    "crates/agena-lsp",
    "crates/agena-otel",
    "crates/agena-mcp-client",
    "crates/agena-mcp-server",
    "crates/agena-marketplace-server",
    "crates/agena-plugin-host",
    "crates/agena-plugin-marketplace",
    "crates/agena-plugin-sdk",
    "crates/agena-rollout",
    "crates/agena-scheduler",
    "crates/agena-skills",
    "examples/echo_plugin",
    "examples/echo_plugin_stdio",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
authors = ["Agena Studio Contributors"]

[workspace.dependencies]
# internal workspace crates
agena = { path = "crates/agena" }
agena-api = { path = "crates/agena-api" }
agena-api-server = { path = "crates/agena-api-server" }
agena-keyring-store = { path = "crates/agena-keyring-store" }
agena-lsp = { path = "crates/agena-lsp" }
agena-mcp-client = { path = "crates/agena-mcp-client" }
agena-mcp-server = { path = "crates/agena-mcp-server" }
agena-otel = { path = "crates/agena-otel" }
agena-plugin-host = { path = "crates/agena-plugin-host" }
agena-plugin-marketplace = { path = "crates/agena-plugin-marketplace" }
agena-plugin-sdk = { path = "crates/agena-plugin-sdk" }
agena-scheduler = { path = "crates/agena-scheduler" }
agena-skills = { path = "crates/agena-skills" }

# async / runtime
tokio = { version = "1.52.2", default-features = false }
async-trait = "0.1.89"
async-stream = "0.3.6"
futures = "0.3.32"
futures-util = "0.3.32"
tokio-stream = "0.1.18"
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = "0.7.18"

# error / utility
anyhow = "1.0.102"
thiserror = "2.0.18"
secrecy = { version = "0.10.3", features = ["serde"] }
abi_stable = "0.11.3"
arc-swap = "1.9.1"
base64 = "0.22.1"
dashmap = "6.1.0"
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std", "pkcs8", "pem", "rand_core"] }
hex = "0.4.3"
parking_lot = "0.12.5"
sha2 = "0.11.0"
smol_str = { version = "0.3.6", features = ["serde"] }
tempfile = "3.27.0"
walkdir = "2.5.0"

# logging / tracing
log = "0.4.28"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false }

# serde / encoding
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = { package = "yaml_serde", version = "0.10.4" }
toml = "1.1.2"

# datetime / ids
chrono = { version = "0.4.44", default-features = false, features = ["clock", "serde"] }
time = "0.3.47"
uuid = { version = "1.23.1", features = ["v4", "serde"] }

# CLI
clap = { version = "4.6.1", features = ["derive", "env"] }

# desktop / packaging
flate2 = "1.1.9"
tar = "0.4.45"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tauri = "2.11.1"
tauri-build = "2.6.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-opener = "2.5.4"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.2"

# HTTP / web
axum = { version = "0.8.9" }
hyper = "1.9.0"
http = "1.4.0"
http-body = "1.0.1"
http-body-util = "0.1.3"
tower = { version = "0.5.3" }
tower-http = { version = "0.6.10" }
reqwest = { version = "0.13.3", default-features = false }
sea-orm = { version = "1.1.20", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-json"] }
sea-orm-migration = { version = "1.1.20", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
url = "2.5.8"

# additional shared crates
argon2 = "0.5.3"
arboard = "3.6.1"
aws-config = "1.8.16"
aws-credential-types = "1.2.14"
aws-sigv4 = { version = "1.4.3", default-features = false, features = ["sign-http", "http1"] }
aws-smithy-eventstream = "0.60.20"
aws-smithy-http = "0.63.6"
aws-smithy-types = "1.4.7"
axum-extra = "0.12.6"
bitflags = "2.11.1"
blake3 = "1.8.5"
clap_complete = "4.6.3"
cron = "0.16.0"
crossterm = "0.29.0"
derive_more = "2.1.1"
eventsource-stream = "0.2.3"
fluent-templates = "0.14.0"
futures-core = "0.3.32"
gcp_auth = "0.12.6"
getrandom = "0.4.2"
globset = "0.4.18"
html2md = "0.2.15"
html_escape = { package = "html-escape", version = "0.2.13" }
ignore = "0.4.25"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
imagesize = "0.14.0"
indexmap = { version = "2.14.0", features = ["serde"] }
keyring = "4.0.0"
keyring-core = "1.0.0"
lru = "0.18.0"
lsp-types = "0.97.0"
mime_guess = "2.0.5"
mockito = "1.7.2"
oauth2 = { version = "5.0.0", default-features = false, features = ["reqwest", "rustls-tls"] }
opentelemetry = "0.31.0"
opentelemetry-otlp = { version = "0.31.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = "0.31.0"
path-clean = "1.0.1"
ratatui = "0.30.0"
regex = "1.12.3"
portable-pty = "0.9.0"
schemars = "1.2.1"
semver = "1.0.28"
shlex = "1.3.0"
strum = "0.28.0"
sys-locale = "0.3.2"
textwrap = "0.16.2"
toml_edit = "0.25.11"
tracing-opentelemetry = "0.32.1"
unic-langid = "0.9.6"
unicode-segmentation = "1.13.2"
unicode-width = "0.2.2"
urlencoding = "2.1.3"
wasmtime = { version = "44.0.1", default-features = false, features = ["cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "44.0.1", default-features = false, features = ["p1"] }

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.rustdoc]
# Many private-item-link / unresolved-link warnings on internal modules;
# documented as TODO to fix incrementally.
broken_intra_doc_links = "allow"
private_intra_doc_links = "allow"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
print_stdout = "allow"
print_stderr = "allow"
unwrap_used = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3

# Smaller, slower-to-build profile for shipping artifacts (CLI / desktop).
# Use with `cargo build --profile dist`.
[profile.dist]
inherits = "release"
lto = "fat"
panic = "abort"
strip = "symbols"
debug = false
incremental = false
