[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.rustdoc]
# Many private-item-link / unresolved-link warnings on internal modules;
# documented as TODO to fix incrementally.
broken_intra_doc_links = "allow"
private_intra_doc_links = "allow"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
print_stdout = "allow"
print_stderr = "allow"
unwrap_used = "allow"

[profile.dev]
# Keep incremental compilation for the interactive edit loop. Debug information
# stays off because it dominates artifact size; developers can opt in for one
# command with CARGO_PROFILE_DEV_DEBUG=1.
debug = 0
incremental = true
lto = false
codegen-units = 256

[profile.test]
debug = 0
incremental = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3

# Smaller, slower-to-build profile for shipping CLI and service artifacts.
# Use with `cargo build --profile dist`.
[profile.dist]
inherits = "release"
lto = "fat"
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[patch.crates-io]
# Agena performs response-bearing terminal queries while the TUI is running.
# Upstream Crossterm 0.29 treats OSC replies as Alt-key input because its
# public event model has no terminal-response event. Keep the parser extension
# local so terminal replies stay typed at the byte boundary and can never
# become composer text.
crossterm = { path = "third_party/crossterm" }
# proc-macro-error2 2.0.1 publicly re-exports a private `proc_macro` extern
# crate, which current Rust reports as a future hard error. Keep the narrow
# compiler-recommended visibility patch locally until upstream releases it.
proc-macro-error2 = { path = "third_party/proc-macro-error2" }
# RaTeX 0.1.13 writes font-discovery diagnostics directly to stderr. Direct
# terminal writes corrupt a running alternate-screen TUI, so use the minimal
# source patch documented alongside the vendored crate.
ratex-unicode-font = { path = "third_party/ratex-unicode-font" }
# ratatui-image 11.0.6 implements its bounded stdio query with a detached
# blocking reader thread. After a timeout that thread can steal later keyboard
# input from Crossterm. This source patch keeps the query on the owning thread,
# uses cancellable descriptor waits, and never mutates tmux configuration.
ratatui-image = { path = "third_party/ratatui-image" }
