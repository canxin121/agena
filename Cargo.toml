[package]
name = "agena"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
async-trait = "0.1.89"
derive_more = { version = "2.1.1", features = ["display", "from"] }
globset = "0.4.16"
path-clean = "1.0.1"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
sea-orm = { version = "1.1.19", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-json"] }
sea-orm-migration = { version = "1.1.19", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
strum = { version = "0.27.2", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
