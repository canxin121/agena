    "crates/agena-client",
    "crates/agena-keyring-store",
    "crates/agena-lsp",
    "crates/agena-mcp-client",
    "crates/agena-mcp-server",
    "crates/agena-memory-index",
    "crates/agena-marketplace-server",
    "crates/agena-notification",
    "crates/agena-permission",
