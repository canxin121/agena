[package]
name = "agena-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Agena command-line application"

[[bin]]
name = "agena"
path = "src/main.rs"

[dependencies]
agena = { path = "../../crates/agena" }
agena-otel = { path = "../../crates/agena-otel" }
clap = { version = "4.5.51", features = ["derive"] }
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
