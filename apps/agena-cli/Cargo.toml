[package]
name = "agena-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Agena command-line application"
[[bin]]
name = "agena"
doc = false
path = "src/main.rs"

[[bin]]
name = "agena-tui"
doc = false
path = "src/bin/agena-tui.rs"

[dependencies]
agena = { workspace = true }
agena-api = { workspace = true }
agena-api-server = { workspace = true, features = ["jsonrpc"] }
agena-mcp-client = { workspace = true }
agena-mcp-server = { workspace = true }
agena-plugin-sdk = { workspace = true }
agena-skills = { workspace = true }
agena-tui-components = { workspace = true }
anyhow = { workspace = true }
arboard = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
comrak = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
fluent-templates = { workspace = true }
futures-util = { workspace = true }
ignore = { workspace = true }
image = { workspace = true }
imagesize = { workspace = true }
indexmap = { workspace = true }
libc = { workspace = true }
mime_guess = { workspace = true }
ratatui = { workspace = true }
ratatui-image = { workspace = true }
resvg = { workspace = true }
ratex-layout = { workspace = true }
ratex-parser = { workspace = true }
ratex-render = { workspace = true }
ratex-types = { workspace = true }
rust-latex-parser = { workspace = true }
term-maths = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
sea-orm = { workspace = true, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
shlex = { workspace = true }
syntect = { workspace = true }
sys-locale = { workspace = true }
tempfile = { workspace = true }
textwrap = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
tracing.workspace = true
tui-markdown = "0.3.7"
unic-langid = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
