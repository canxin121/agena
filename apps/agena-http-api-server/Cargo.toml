[package]
name = "agena-http-api-server"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Agena HTTP API server application"

[[bin]]
name = "agena-http-api"
path = "src/main.rs"

[dependencies]
agena = { path = "../../crates/agena" }
agena-api-server = { path = "../../crates/agena-api-server" }
agena-http-api = { path = "../../crates/agena-http-api" }
axum = "0.8.6"
clap = { version = "4.5.51", features = ["derive", "env"] }
sea-orm = { version = "1.1.19", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "signal", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
