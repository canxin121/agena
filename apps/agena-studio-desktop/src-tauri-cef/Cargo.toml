[package]
name = "agena-studio-desktop-cef"
version.workspace = true
description = "Agena Studio Desktop (Tauri wrapper, CEF)"
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
[lib]
name = "agena_studio_desktop_cef"
path = "../src-tauri/src/lib.rs"

[[bin]]
name = "agena-studio-desktop-cef"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

tokio = { workspace = true, features = ["sync", "time"] }
reqwest = { workspace = true, default-features = true, features = ["json"] }
flate2 = { workspace = true }
tar = { workspace = true }
zip = { workspace = true, default-features = false, features = ["deflate"] }

tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-shell = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-single-instance = { workspace = true }

[features]
cef = []

[lints]
workspace = true
