[package]
name = "agena-studio-server"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Agena Studio backend application"

[[bin]]
name = "agena-studio"
path = "src/main.rs"

[dependencies]
agena = { path = "../../crates/agena" }
agena-api-server = { path = "../../crates/agena-api-server" }
agena-http-api = { path = "../../crates/agena-http-api" }
anyhow = "1.0.100"
axum = { version = "0.8.8", features = ["macros", "ws"] }
axum-extra = { version = "0.12.5", features = ["cookie"] }
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive", "env"] }
dashmap = "6.1.0"
getrandom = "0.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sea-orm = { version = "1.1.19", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
tokio = { version = "1.49.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["compression-full", "cors", "fs", "limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
argon2 = "0.5.3"
thiserror = "2.0.18"
time = { version = "0.3.46", features = ["formatting"] }
url = "2.5.8"
