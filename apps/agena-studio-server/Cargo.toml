[package]
name = "agena-studio-server"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Agena Studio backend application"

[[bin]]
name = "agena-studio"
path = "src/main.rs"

[dependencies]
agena = { path = "../../crates/agena" }
agena-api-server = { path = "../../crates/agena-api-server" }
anyhow = { workspace = true }
axum = { workspace = true, features = ["macros", "ws"] }
axum-extra = { version = "0.12.5", features = ["cookie"] }
base64 = "0.22.1"
clap = { workspace = true }
dashmap = "6.1.0"
getrandom = "0.4.0"
serde = { workspace = true }
serde_json = { workspace = true }
sea-orm = { version = "1.1.19", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
tokio = { workspace = true, features = ["full"] }
tower-http = { workspace = true, features = ["compression-full", "cors", "fs", "limit", "trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
argon2 = "0.5.3"
time = { version = "0.3.46", features = ["formatting"] }
url = "2.5.8"

[lints]
workspace = true
