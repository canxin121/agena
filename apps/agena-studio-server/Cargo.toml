[package]
name = "agena-studio-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Agena Studio backend application"
[[bin]]
name = "agena-studio"
path = "src/main.rs"

[dependencies]
agena = { workspace = true }
agena-api-server = { workspace = true }
anyhow = { workspace = true }
async-stream = { workspace = true }
axum = { workspace = true, features = ["macros", "ws"] }
axum-extra = { workspace = true, features = ["cookie"] }
base64 = { workspace = true }
clap = { workspace = true }
dashmap = { workspace = true }
getrandom = { workspace = true }
agena-otel = { workspace = true }
ignore = { workspace = true }
mime_guess = { workspace = true }
path-clean = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sea-orm = { workspace = true, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
tokio = { workspace = true, features = ["full"] }
tower-http = { workspace = true, features = ["compression-full", "cors", "fs", "limit", "trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
argon2 = { workspace = true }
time = { workspace = true, features = ["formatting"] }
url = { workspace = true }
urlencoding = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true }

[lints]
workspace = true
