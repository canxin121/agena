[package]
name = "agena-studio-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Agena Studio backend application"
[[bin]]
name = "agena-studio"
path = "src/main.rs"

[dependencies]
agena-runtime = { workspace = true }
agena-api-server = { workspace = true }
agena-application = { workspace = true }
anyhow = { workspace = true }
async-stream = { workspace = true }
axum = { workspace = true, features = ["macros", "ws"] }
axum-extra = { workspace = true, features = ["cookie"] }
base64 = { workspace = true }
bytes = "1.12.1"
clap = { workspace = true }
dashmap = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
git2 = { version = "0.21.0", default-features = false, features = ["ssh", "https", "vendored-libgit2", "vendored-openssl"] }
ignore = { workspace = true }
libc = "0.2.186"
portable-pty = { workspace = true }
regex = { workspace = true }
reqwest = { version = "0.13.4", default-features = true, features = ["json", "stream", "gzip", "brotli", "deflate"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "tls-rustls"] }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite = { workspace = true }
tower-http = { workspace = true, features = ["compression-full", "cors", "fs", "limit", "trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
argon2 = { workspace = true }
time = { workspace = true, features = ["formatting"] }
url = { workspace = true }
urlencoding = { workspace = true }
walkdir = { workspace = true }

[lints]
workspace = true
