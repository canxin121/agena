[package]
name = "agena-tui"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
agena = { path = "../../crates/agena" }
agena-api = { path = "../../crates/agena-api" }
agena-api-server = { path = "../../crates/agena-api-server" }
agena-otel = { path = "../../crates/agena-otel" }
agena-skills = { path = "../../crates/agena-skills" }
arboard = "3.6.1"
anyhow = { workspace = true }
base64 = "0.22.1"
chrono = { workspace = true }
clap = { workspace = true }
crossterm = { version = "0.28.1", features = ["event-stream"] }
fluent-templates = "0.13.2"
futures-util = "0.3.31"
ignore = "0.4.25"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
imagesize = "0.13.0"
mime_guess = "2.0.5"
ratatui = "0.29.0"
sea-orm = { version = "1.1.19", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
shlex = "1.3.0"
sys-locale = "0.3.2"
tempfile = "3.23.0"
textwrap = "0.16.2"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
unic-langid = "0.9.6"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.0"
url = "2.5.7"
uuid = { workspace = true }

[lints]
workspace = true
