[package]
name = "agena-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
agena = { path = "../../crates/agena" }
agena-http-api = { path = "../../crates/agena-http-api" }
arboard = "3.6.1"
anyhow = "1.0.100"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.51", features = ["derive", "env"] }
crossterm = { version = "0.28.1", features = ["event-stream"] }
fluent-templates = "0.13.2"
futures-util = "0.3.31"
ignore = "0.4.25"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
imagesize = "0.13.0"
mime_guess = "2.0.5"
ratatui = "0.29.0"
sea-orm = { version = "1.1.19", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
shlex = "1.3.0"
sys-locale = "0.3.2"
tempfile = "3.23.0"
textwrap = "0.16.2"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
unic-langid = "0.9.6"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.0"
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
