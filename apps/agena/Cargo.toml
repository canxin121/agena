[package]
name = "agena"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Agena command-line application"
autobins = false

[[bin]]
name = "agena"
doc = false
path = "src/main.rs"

[dependencies]
agena-api = { workspace = true }
agena-api-server = { workspace = true, features = ["jsonrpc"] }
agena-application = { workspace = true }
agena-cli = { workspace = true }
agena-client = { workspace = true }
agena-domain = { workspace = true }
agena-provider = { workspace = true }
agena-runtime = { workspace = true }
agena-tui = { workspace = true }
agena-tui-app = { workspace = true }
agena-tui-platform = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["macros", "ws"] }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dashmap = { workspace = true }
getrandom = { workspace = true }
libc = "0.2.186"
reqwest = { version = "0.13.4", default-features = true, features = ["json", "stream", "gzip", "brotli", "deflate"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tower-http = { workspace = true, features = ["trace"] }
thiserror = { workspace = true }
argon2 = { workspace = true }
time = { workspace = true, features = ["formatting"] }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
tempfile = { workspace = true }
# Integration tests spawn the agena binary and reach into the SQLite database
# to set up lease-staleness scenarios (see tests/server_restart.rs).
portable-pty = { workspace = true }
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "tls-rustls"] }

[lints]
workspace = true
