[package]
name = "agena"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Agena command-line application"
autobins = false

[lib]
name = "agena_app"

[[bin]]
name = "agena"
doc = false
path = "src/main.rs"

[dependencies]
agena-runtime = { workspace = true }
agena-domain = { workspace = true }
agena-provider = { workspace = true }
agena-application = { workspace = true }
agena-cli = { workspace = true }
agena-api = { workspace = true }
agena-api-server = { workspace = true, features = ["jsonrpc"] }
agena-plugin-sdk = { workspace = true }
agena-plugin-host = { workspace = true }
agena-tui-components = { workspace = true }
agena-tui = { workspace = true }
anyhow = { workspace = true }
arboard = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
comrak = { workspace = true }
clap = { workspace = true }
crossterm.workspace = true
ignore = { workspace = true }
image = { workspace = true }
imagesize = { workspace = true }
indexmap = { workspace = true }
libc = { workspace = true }
mime_guess = { workspace = true }
ratatui = { workspace = true }
ratatui-image = { workspace = true }
resvg = { workspace = true }
roxmltree = { workspace = true }
ratex-layout = { workspace = true }
ratex-parser = { workspace = true }
ratex-render = { workspace = true }
ratex-types = { workspace = true }
pulldown-latex = { workspace = true }
rust-latex-parser = { workspace = true }
term-maths = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
shlex = { workspace = true }
syntect = { workspace = true }
tempfile = { workspace = true }
textwrap = { workspace = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
tracing.workspace = true
tui-markdown = { version = "0.3.8", default-features = false }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
