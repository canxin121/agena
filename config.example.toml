[runtime]
# Set `default_agent` explicitly when you want a different primary persona for
# new root sessions.
default_agent = "build"

# Agena also loads a remote model catalog for provider defaults, model picker
# metadata, and local workspace overrides. Defaults point at this repository's
# `catalog/model-catalog.json` raw file and fall back to the bundled copy.
#
# [runtime.model_catalog]
# remote_url = "https://raw.githubusercontent.com/canxin121/agena/main/catalog/model-catalog.json"
# fallback_url = "https://raw.githubusercontent.com/canxin121/agena/main/catalog/model-catalog.json"
# cache_max_age_secs = 86400

[agents.plan]
description = "Read-only planning agent"
prompt = "You are a planning agent. Break work into concrete steps, surface assumptions and blockers, and keep the output actionable."
allowed_entries = ["read", "view_file", "glob", "grep", "bash", "todo_write", "enter_plan_mode", "exit_plan_mode"]
mode = "all"

[permission.path]
workspace = { read = "allow", write = "ask" }
external = { read = "ask", write = "ask" }

[permission.network]
internet = "ask"
private = "deny"
loopback = "deny"

[permission.network.rules]
"github.com" = "allow"

[permission.entries.tags]
filesystem_read = "allow"
filesystem_write = "ask"
network = "ask"
internet = "ask"
task = "ask"
shell = "ask"

[agents.plan.permission.path]
workspace = { read = "allow", write = "deny" }
external = { read = "ask", write = "ask" }

[agents.plan.permission.entries.names]
enter_plan_mode = "allow"
exit_plan_mode = "allow"
todo_write = "allow"
