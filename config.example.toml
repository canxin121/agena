# Minimal Agena configuration — the smallest viable config to boot the
# runtime against a single provider.
#
# For the full feature surface (hooks, telemetry, plugin registries,
# permission rules, MCP plugin options, web search backends, ...) see
# `config.full.toml` in the repo root.

[tracing]
# Main app logs still follow `filter`; DB / SQL logs can be tuned independently
# with `database_level` when `info` is too noisy.
filter = "info"
# database_level = "error"

[auth]
# `auto` prefers the OS keyring and falls back to store_path when
# the keyring is unavailable.
store_backend = "auto"

# At least one provider must be configured. Pick the LLM endpoint you
# have credentials for and remove the others.

[providers.anthropic]
kind = "anthropic"
base_url = "https://api.anthropic.com/v1"
default_model = "claude-sonnet-4-6"
api_key_env = "ANTHROPIC_API_KEY"

# [providers.openai]
# kind = "openai"
# base_url = "https://api.openai.com/v1"
# default_model = "gpt-4o"
# api_key_env = "OPENAI_API_KEY"

# [providers.gemini]
# kind = "gemini"
# base_url = "https://generativelanguage.googleapis.com/v1beta"
# default_model = "gemini-2.5-pro"
# api_key_env = "GEMINI_API_KEY"

[runtime]
# Set `default_agent` explicitly when you want a different primary persona for
# new root sessions.
default_agent = "build"

[agents.plan]
description = "Read-only planning agent"
prompt = "You are a planning agent. Break work into concrete steps, surface assumptions and blockers, and keep the output actionable."
allowed_entries = ["read", "view_file", "glob", "grep", "bash", "todo_write", "enter_plan_mode", "exit_plan_mode"]
mode = "all"

[permission.path]
workspace = { read = "allow", write = "ask" }
external = { read = "ask", write = "ask" }

[permission.network]
internet = "ask"
private = "deny"
loopback = "deny"

[permission.network.rules]
"github.com:443" = "allow"

[permission.entries.tags]
filesystem_read = "allow"
filesystem_write = "ask"
network = "ask"
internet = "ask"
task = "ask"
shell = "ask"

[agents.plan.permission.path]
workspace = { read = "allow", write = "deny" }
external = { read = "ask", write = "ask" }

[agents.plan.permission.entries.names]
enter_plan_mode = "allow"
exit_plan_mode = "allow"
todo_write = "allow"
