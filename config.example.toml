# Minimal Agena configuration — the smallest viable config to boot the
# runtime against a single provider.
#
# For the full feature surface (hooks, telemetry, plugin registries,
# permission rules, MCP plugin options, web search backends, ...) see
# `config.full.toml` in the repo root.

[tracing]
# Main app logs still follow `filter`; DB / SQL logs can be tuned independently
# with `database_level` when `info` is too noisy.
filter = "info"
# database_level = "error"

[auth]
# `auto` prefers the OS keyring and falls back to store_path when
# the keyring is unavailable.
store_backend = "auto"

[default]
# Global defaults for new sessions and command invocations. `model` is the
# backend-visible model id; `adapter` only selects the protocol route used by
# the provider.
provider = "anthropic"
adapter = "anthropic"
model = "claude-sonnet-4-6"
agent = "build"

# At least one provider must be configured. Pick the LLM endpoint you have
# credentials for and remove the others. These examples use the preferred
# `provider + auth + adapters` layout.

[providers.anthropic]

[providers.anthropic.auth]
mode = "api"
base_url = "https://api.anthropic.com/v1"
api_key_env = "ANTHROPIC_API_KEY"

[providers.anthropic.adapters.anthropic]
enabled = true

