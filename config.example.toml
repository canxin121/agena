# Minimal Agena configuration — the smallest viable config to boot the
# runtime against a single provider.
#
# For the full feature surface (hooks, telemetry, plugin registries,
# permission rules, MCP servers, web search backends, …) see
# `config.full.toml` in the repo root.

[auth]
# `auto` prefers the OS keyring and falls back to store_path when
# the keyring is unavailable.
store_backend = "auto"

# At least one provider must be configured. Pick the LLM endpoint you
# have credentials for and remove the others.

[providers.anthropic]
kind = "anthropic"
base_url = "https://api.anthropic.com/v1"
default_model = "claude-sonnet-4-6"
api_key_env = "ANTHROPIC_API_KEY"

# [providers.openai]
# kind = "openai"
# base_url = "https://api.openai.com/v1"
# default_model = "gpt-4o"
# api_key_env = "OPENAI_API_KEY"

# [providers.gemini]
# kind = "gemini"
# base_url = "https://generativelanguage.googleapis.com/v1beta"
# default_model = "gemini-2.5-pro"
# api_key_env = "GEMINI_API_KEY"

[permissions]
# `prompt` asks before every tool action; `allow` runs trusted tools
# without prompting; `deny` is dry-run.
default_mode = "prompt"
