[tracing]
filter = "info"
database_level = "error"

[telemetry]
enabled = false
service_name = "agena"
# otlp_endpoint = "http://127.0.0.1:4318/v1/traces"

[auth]
# auto prefers the OS keyring and falls back to store_path when keyring is unavailable.
store_backend = "auto"
# store_path = "~/.agena/auth.json"

[runtime]
# Primary agent for new root sessions. If omitted, Agena now defaults to the
# built-in `build` agent.
default_agent = "build"

[runtime.provider_http]
timeout_secs = 120
connect_timeout_secs = 15

[runtime.request_retry]
max_retries = 5
base_delay_ms = 250
max_delay_ms = 2000

[runtime.stream_replay]
max_retries_after_output = 5
max_tracked_events = 2048

[runtime.reload]
enabled = true
poll_interval_secs = 2

[runtime.janitor]
enabled = true
interval_secs = 30

[runtime.session_cache]
max_sessions = 128
ttl_secs = 900
max_bytes = 67108864

[agents.plan]
description = "Read-only planning agent"
prompt = "You are a planning agent. Break work into concrete steps, surface assumptions and blockers, and keep the output actionable."
allowed_tools = ["read", "view_file", "glob", "grep", "bash", "todo_write", "enter_plan_mode", "exit_plan_mode"]
mode = "all"

[permission.path]
workspace = { read = "allow", write = "ask" }
external = { read = "ask", write = "ask" }

[permission.path.rules]
"<cwd>/.env*" = { read = "ask", write = "deny" }
"<cwd>/secrets/**" = { read = "deny", write = "deny" }

[permission.network]
internet = "ask"
private = "deny"
loopback = "deny"

[permission.network.rules]
"github.com:443" = "allow"
"*.corp.local:443" = "ask"
"10.0.0.0/8:*" = "deny"

[permission.tools.tags]
read_only = "allow"
filesystem_read = "allow"
filesystem_write = "ask"
network = "ask"
internet = "ask"
mutating = "ask"
task = "ask"
shell = "ask"

[permission.tools.first_party]
bash = "ask"
apply_patch = "ask"

[agents.plan.permission.path]
workspace = { read = "allow", write = "deny" }
external = { read = "ask", write = "ask" }

[agents.plan.permission.tools.first_party]
enter_plan_mode = "allow"
exit_plan_mode = "allow"
todo_write = "allow"

[memory.project_instructions]
enabled = true
include_global = true

# User-configurable hooks. Each hook can run a local shell command or POST JSON
# to an HTTP endpoint. Hook stdout may return a JSON patch for events that
# support mutation, such as `user_prompt_submit` or `pre_tool_use`.
#
# Supported event names:
#   user_prompt_submit, pre_tool_use, post_tool_use, post_tool_use_failure,
#   stop, session_start, session_end, notification
#
# [[hooks]]
# event = "user_prompt_submit"
# command = "python3 .agena/hooks/enrich_prompt.py"
# timeout_ms = 3000
#
# [[hooks]]
# event = "pre_tool_use"
# command = "python3 .agena/hooks/check_tool.py"
# timeout_ms = 5000
# matcher = { tool = "bash" }
#
# [[hooks]]
# event = "post_tool_use"
# url = "http://127.0.0.1:8080/agena-hook"
# timeout_ms = 2000
#
# [[hooks]]
# event = "notification"
# command = "notify-send \"$AGENA_NOTIFICATION_TITLE\" \"$AGENA_NOTIFICATION_MESSAGE\""
# timeout_ms = 2000

[plugins]
enabled = true
# Optional global timeout overlay applied to every plugin (per-plugin
# `timeouts = { ... }` keys override these). Values like "5s", "2m", "200ms".
# timeouts = { tool_invoke = "60s", permission_ask = "10s" }

# Each entry under `[plugins.list.<id>]` declares a plugin. The `kind`
# discriminator picks the transport. Supported kinds:
#
#   * static  — compiled-in via `PluginHostBuilder::register_static`
#   * cdylib  — local dynamic library (`abi_stable`-based ABI)
#   * stdio   — subprocess speaking JSON-RPC over its stdin/stdout
#   * http    — remote service speaking JSON-RPC over POST
#   * wasm    — WebAssembly module (requires plugin-wasm feature)
#
# First-party static plugins such as agena.fs, agena.shell, agena.web,
# agena.workflow, agena.skills_fs, agena.lsp, and agena.cron are registered by
# the runtime. Model-visible built-ins now come from plugin entries, not from
# separate built-in / skill / command registries.
#
# Plugins that call host callbacks must declare matching host_capabilities in
# their manifest entries. For example, host/config.read requires ReadConfig,
# host/entry.* requires EntryRegistry, and host/lsp.list_* requires LspRegistry.
#
# Plugin storage and secrets live under ~/.agena/plugin-storage by default
# (override with the AGENA_PLUGIN_STORAGE_DIR environment variable). Storage is
# plain JSON keyed by (plugin_id, namespace, key); secrets go to the OS keyring
# under the agena.plugin service.
#
# Note: the runtime config schema does not currently expose a `[plugins.storage]`
# TOML section. Today the only supported override is:
#
#   AGENA_PLUGIN_STORAGE_DIR=/var/lib/agena/plugin-storage
#
# Stdio plugins respect [plugins.list.<id>.restart] for backoff/retry and the
# host tracks their pid + restart history. Plugins that declare
# HostCapability::PluginStatus can query host/plugin.status.list /
# host/plugin.status.get for daemon health.
#
# Examples (commented out — copy and adapt as needed):
#
# [plugins.list.echo]
# kind = "cdylib"
# path = "examples/echo_plugin/target/debug/libagena_echo_plugin.so"
# options = { uppercase = true }
#
# [plugins.list.lint]
# kind = "stdio"
# command = "node"
# args = ["./plugins/lint/index.js"]
# env = { LINT_LEVEL = "warn" }
# restart = { policy = "on-failure", min_backoff = "1s", max_backoff = "30s", max_retries = 5 }
# options = { project = "rust" }
#
# [plugins.list.cloud-policy]
# kind = "http"
# url = "https://policy.example.com/agena/rpc"
# auth = { kind = "bearer", token_env = "AGENA_POLICY_TOKEN" }
# options = { org_id = "acme" }

[providers.openai]
kind = "openai"
base_url = "https://api.openai.com/v1"
default_model = "gpt-4.1-mini"
api_key_env = "OPENAI_API_KEY"
api_mode = "auto"
stream_mode = "sse"

# Optional explicit per-model metadata / capability configuration.
# Keys are exact model ids under the provider; no matcher syntax is supported.
#
# [providers.openai.models."gpt-4.1-mini"]
# input = { unsupported = ["image"] }
# features = ["tool_calling"]
# display_name = "GPT-4.1 Mini Internal"
# family = "gpt"
# lifecycle = "active"
# context_window_tokens = 200000
# max_output_tokens = 16384

# Per-model variants. Runtime can select these by name via run options; without
# a selected variant, Agena does not inject explicit thinking settings.
#
# Example — OpenAI o-series / GPT-5 with named reasoning levels:
#
# [providers.openai-reasoning]
# kind = "openai"
# base_url = "https://api.openai.com/v1"
# default_model = "o3-mini"
# api_key_env = "OPENAI_API_KEY"
#
# [providers.openai-reasoning.models."o3-mini".variants.light]
# display_name = "Light"
# thinking = { type = "effort", effort = "low" }
#
# [providers.openai-reasoning.models."o3-mini".variants.deep]
# display_name = "Deep"
# thinking = { type = "effort", effort = "high" }
#
# Example — Anthropic with named thinking levels:
#
# [providers.anthropic]
# kind = "anthropic"
# base_url = "https://api.anthropic.com/v1"
# default_model = "claude-sonnet-4-5"
# api_key_env = "ANTHROPIC_API_KEY"
#
# [providers.anthropic.models."claude-sonnet-4-5".variants.light]
# display_name = "Light"
# thinking = { type = "enabled", budget_tokens = 3000 }
#
# [providers.anthropic.models."claude-sonnet-4-5".variants.deep]
# display_name = "Deep"
# thinking = { type = "enabled", budget_tokens = 30000 }

# Built-in / models.dev preset examples:
#
# [providers.ollama]
# kind = "preset"
# default_model = "qwen3:14b"
#
# [providers.lmstudio]
# kind = "preset"
# default_model = "local-model"
#
# [providers.openrouter]
# kind = "preset"
#
# [providers.deepseek]
# kind = "preset"
#
# [providers.xai]
# kind = "preset"
#
# [providers.groq]
# kind = "preset"
#
# [providers.mistral]
# kind = "preset"
#
# [providers."github-copilot"]
# kind = "preset"
#
# [providers."google-vertex"]
# kind = "preset"

[providers.codex]
kind = "codex"
default_model = "gpt-5.3-codex"
auth_provider_id = "openai"

[providers."github-copilot"]
kind = "copilot"
auth_provider_id = "github-copilot"

[providers.ollama]
kind = "ollama"
base_url = "http://localhost:11434"
default_model = "qwen3:14b"

[providers.gitlab]
kind = "gitlab"
instance_url = "https://gitlab.com"
ai_gateway_url = "https://cloud.gitlab.com"
default_model = "claude-sonnet-4-5"
auth_provider_id = "gitlab"

[providers."google-vertex"]
kind = "google_vertex"
base_url = "https://us-central1-aiplatform.googleapis.com/v1/projects/PROJECT/locations/us-central1/endpoints/openapi"
default_model = "google/gemini-2.5-flash"
access_token_env = "GOOGLE_VERTEX_ACCESS_TOKEN"
