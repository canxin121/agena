[tracing]
filter = "info"
database_level = "error"

[telemetry]
enabled = false
service_name = "agena"
# otlp_endpoint = "http://127.0.0.1:4318/v1/traces"

[runtime]
# Primary agent for new root sessions.
default_agent = "build"

[runtime.provider_http]
timeout_secs = 120
connect_timeout_secs = 15

[runtime.request_retry]
max_retries = 5
base_delay_ms = 250
max_delay_ms = 2000

[runtime.stream_replay]
max_retries_after_output = 5
max_tracked_events = 2048

[runtime.reload]
enabled = true
poll_interval_secs = 2

[runtime.janitor]
enabled = true
interval_secs = 30

[runtime.session_cache]
max_sessions = 128
ttl_secs = 900
max_bytes = 67108864

[agents.plan]
description = "Read-only planning agent"
prompt = "You are a planning agent. Break work into concrete steps, surface assumptions and blockers, and keep the output actionable."
allowed_entries = ["read", "view_file", "glob", "grep", "bash", "todo_write", "enter_plan_mode", "exit_plan_mode"]
mode = "all"

[permission.path]
workspace = { read = "allow", write = "ask" }
external = { read = "ask", write = "ask" }

[permission.path.rules]
"<cwd>/.env*" = { read = "ask", write = "deny" }
"<cwd>/secrets/**" = { read = "deny", write = "deny" }

[permission.network]
internet = "ask"
private = "deny"
loopback = "deny"

[permission.network.rules]
"github.com:443" = "allow"
"api.github.com" = "allow"
"*.corp.local" = "ask"
"*.corp.local:8443" = "allow"
"10.0.0.0/8" = "deny"
"172.16.0.0/12:*" = "ask"
"fd00::/8" = "deny"
"[::1]:3000" = "ask"

[permission.entries.tags]
filesystem_read = "allow"
filesystem_write = "ask"
network = "ask"
internet = "ask"
task = "ask"
shell = "ask"

[permission.entries.names]
bash = "ask"
apply_patch = "ask"

[agents.plan.permission.path]
workspace = { read = "allow", write = "deny" }
external = { read = "ask", write = "ask" }

[agents.plan.permission.entries.names]
enter_plan_mode = "allow"
exit_plan_mode = "allow"
todo_write = "allow"

[plugins]
enabled = true
# Optional global timeout overlay applied to every plugin (per-plugin
# `timeouts = { ... }` keys override these). Values like "5s", "2m", "200ms".
# timeouts = { tool_invoke = "60s", permission_ask = "10s" }

# Each entry under `[plugins.list.<id>]` declares a plugin. The `kind`
# discriminator picks the transport. Supported kinds:
#
#   * static  — compiled-in via `PluginHostBuilder::register_static`
#   * cdylib  — local dynamic library (`abi_stable`-based ABI)
#   * stdio   — subprocess speaking JSON-RPC over its stdin/stdout
#   * http    — remote service speaking JSON-RPC over POST
#   * wasm    — WebAssembly module (requires plugin-wasm feature)
#
# First-party static plugins such as agena.fs, agena.shell, agena.web,
# agena.workflow, agena.skills_fs, agena.lsp, agena.cron, agena.memory,
# agena.hooks, and agena.mcp are registered by the runtime. Model-visible
# built-ins are plugin entries.
#
# Plugins that call host callbacks must declare matching host_capabilities in
# their manifest entries. For example, host/config.read requires ReadConfig,
# host/entry.* requires EntryRegistry, and host/lsp.list_* requires LspRegistry.
#
# Plugin storage and secrets live under ~/.agena/plugin-storage by default
# (override with the AGENA_PLUGIN_STORAGE_DIR environment variable). Storage is
# plain JSON keyed by (plugin_id, namespace, key); secrets go to the OS keyring
# under the agena.plugin service.
#
# Storage root override:
#
#   AGENA_PLUGIN_STORAGE_DIR=/var/lib/agena/plugin-storage
#
# Stdio plugins respect [plugins.list.<id>.restart] for backoff/retry and the
# host tracks their pid + restart history. Plugins that declare
# HostCapability::PluginStatus can query host/plugin.status.list /
# host/plugin.status.get for daemon health.
#
# Examples (commented out — copy and adapt as needed):
#
# [plugins.list.echo]
# kind = "cdylib"
# path = "examples/echo_plugin/target/debug/libagena_echo_plugin.so"
# options = { uppercase = true }
#
# [plugins.list.lint]
# kind = "stdio"
# command = "node"
# args = ["./plugins/lint/index.js"]
# env = { LINT_LEVEL = "warn" }
# restart = { policy = "on-failure", min_backoff = "1s", max_backoff = "30s", max_retries = 5 }
# options = { project = "rust" }
#
# [plugins.list.cloud-policy]
# kind = "http"
# url = "https://policy.example.com/agena/rpc"
# auth = { kind = "bearer", token_env = "AGENA_POLICY_TOKEN" }
# options = { org_id = "acme" }

[plugins.list."agena.memory"]
kind = "static"

[plugins.list."agena.memory".options.project_instructions]
enabled = true
include_global = true

# User-configurable hooks are configured as agena.hooks plugin options. Each
# hook can run a local shell command or POST JSON to an HTTP endpoint. Hook
# stdout may return a JSON patch for events that support mutation, such as
# `user_prompt_submit` or `pre_tool_use`.
#
# Supported event names:
#   user_prompt_submit, pre_tool_use, post_tool_use, post_tool_use_failure,
#   stop, session_start, session_end, notification
#
# [plugins.list."agena.hooks"]
# kind = "static"
#
# [[plugins.list."agena.hooks".options.hooks]]
# event = "user_prompt_submit"
# command = "python3 .agena/hooks/enrich_prompt.py"
# timeout_ms = 3000
#
# [[plugins.list."agena.hooks".options.hooks]]
# event = "pre_tool_use"
# command = "python3 .agena/hooks/check_tool.py"
# timeout_ms = 5000
# matcher = { tool = "bash" }
#
# [[plugins.list."agena.hooks".options.hooks]]
# event = "post_tool_use"
# url = "http://127.0.0.1:8080/agena-hook"
# timeout_ms = 2000
#
# [[plugins.list."agena.hooks".options.hooks]]
# event = "notification"
# command = "notify-send \"$AGENA_NOTIFICATION_TITLE\" \"$AGENA_NOTIFICATION_MESSAGE\""
# timeout_ms = 2000
#
# MCP server options are owned by the agena.mcp static plugin.
#
# [plugins.list."agena.mcp"]
# kind = "static"
#
# [plugins.list."agena.mcp".options.servers.filesystem]
# transport = "stdio"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "."]
#
# LSP server options are owned by the agena.lsp static plugin.
#
# [plugins.list."agena.lsp"]
# kind = "static"
#
# [plugins.list."agena.lsp".options.servers.rust]
# command = "rust-analyzer"
# args = []
# file_extensions = ["rs"]
# root_markers = ["Cargo.toml"]
#
# Web fetch/search options are owned by the agena.web static plugin.
#
# [plugins.list."agena.web"]
# kind = "static"
#
# [plugins.list."agena.web".options]
# fetch_enabled = true
#
# [plugins.list."agena.web".options.search]
# backend = "duck_duck_go_html"

[providers.openai]
default_model = "gpt-4.1-mini"

[providers.openai.auth]
mode = "api"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[providers.openai.adapters.openai]
default_model = "gpt-4.1-mini"
api_mode = "auto"
stream_mode = "sse"

# Optional explicit per-model metadata / capability configuration.
# Keys are exact model ids under the provider; no matcher syntax is supported.
#
# [providers.openai.adapters.openai.models."gpt-4.1-mini"]
# input = { unsupported = ["image"] }
# features = ["tool_calling"]
# display_name = "GPT-4.1 Mini Internal"
# family = "gpt"
# lifecycle = "active"
# context_window_tokens = 200000
# max_output_tokens = 16384

# Per-model variants. Runtime can select these by name via run options; without
# a selected variant, Agena does not inject explicit thinking settings.
#
# Example — OpenAI o-series / GPT-5 with named reasoning levels:
#
# [providers.openai-reasoning]
# default_model = "o3-mini"
#
# [providers.openai-reasoning.auth]
# mode = "api"
# base_url = "https://api.openai.com/v1"
# api_key_env = "OPENAI_API_KEY"
#
# [providers.openai-reasoning.adapters.openai]
# default_model = "o3-mini"
#
# [providers.openai-reasoning.adapters.openai.models."o3-mini".variants.light]
# display_name = "Light"
# thinking = { type = "effort", effort = "low" }
#
# [providers.openai-reasoning.adapters.openai.models."o3-mini".variants.deep]
# display_name = "Deep"
# thinking = { type = "effort", effort = "high" }
#
# Example — Anthropic with named thinking levels:
#
# [providers.anthropic]
# default_model = "claude-sonnet-4-5"
#
# [providers.anthropic.auth]
# mode = "api"
# base_url = "https://api.anthropic.com/v1"
# api_key_env = "ANTHROPIC_API_KEY"
#
# [providers.anthropic.adapters.anthropic]
# default_model = "claude-sonnet-4-5"
#
# [providers.anthropic.adapters.anthropic.models."claude-sonnet-4-5".variants.light]
# display_name = "Light"
# thinking = { type = "budget", budget_tokens = 3000 }
#
# [providers.anthropic.adapters.anthropic.models."claude-sonnet-4-5".variants.deep]
# display_name = "Deep"
# thinking = { type = "budget", budget_tokens = 30000 }

# Common explicit provider examples using the canonical provider/auth/adapter
# structure:
#
# [providers.ollama]
# default_model = "qwen3:14b"
#
# [providers.ollama.adapters.ollama]
# base_url = "http://localhost:11434"
# default_model = "qwen3:14b"
#
# [providers.lmstudio]
# default_model = "local-model"
#
# [providers.lmstudio.auth]
# mode = "api"
# base_url = "http://localhost:1234/v1"
# api_key = "local"
#
# [providers.lmstudio.adapters.openai_compatible]
# default_model = "local-model"
#
# [providers.openrouter]
# default_model = "openai/gpt-4o-mini"
#
# [providers.openrouter.auth]
# mode = "api"
# base_url = "https://openrouter.ai/api/v1"
# api_key_env = "OPENROUTER_API_KEY"
#
# [providers.openrouter.adapters.openai_compatible]
# default_model = "openai/gpt-4o-mini"
#
# [providers."github-copilot"]
# default_model = "gpt-4o-mini"
#
# [providers."github-copilot".auth]
# mode = "credential"
# issuer = "github_copilot"
# credential = { type = "oauth", issuer = "github_copilot", refresh = "copilot-refresh-token", access = "copilot-access-token", expires_at_ms = 4102444800000 }
#
# [providers."github-copilot".adapters.openai]
# base_url = "https://api.githubcopilot.com"
# models_url = "https://api.githubcopilot.com/models"
# default_model = "gpt-4o-mini"
#
# [providers."github-copilot".adapters.openai.models."gpt-4o-mini"]
# target_model = "gpt-4o-mini"
#
# [providers."github-copilot".adapters.anthropic]
# auth_header = "authorization"
# auth_scheme = "Bearer"
# extra_beta_header = "interleaved-thinking-2025-05-14"
# default_model = "claude-sonnet-4"
#
# [providers."github-copilot".adapters.anthropic.models.claude]
# target_model = "claude-sonnet-4"
#
# [providers."google-vertex"]
# default_model = "gemini-2.5-pro"
#
# [providers."google-vertex".auth]
# mode = "api"
# base_url = "https://aiplatform.googleapis.com/v1/projects/my-project/locations/global/endpoints/openapi"
# api_key_env = "GOOGLE_VERTEX_ACCESS_TOKEN"
#
# [providers."google-vertex".adapters.openai]
# default_model = "gemini-2.5-pro"
# capability_family = "gemini"

[providers.openai_chatgpt]
default_model = "gpt-5.3-codex"

[providers.openai_chatgpt.auth]
mode = "credential"
issuer = "openai_chatgpt"
credential = { type = "oauth", issuer = "openai_chatgpt", refresh = "openai-refresh-token", access = "openai-access-token", expires_at_ms = 4102444800000, account_id = "acct-example" }

[providers.openai_chatgpt.adapters.openai]
backend = "chatgpt_codex"
default_model = "gpt-5.3-codex"

[providers."github-copilot"]
