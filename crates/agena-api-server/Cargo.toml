[package]
name = "agena-api-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
[features]
default = ["http", "ws", "sse", "ipc", "jsonrpc"]
http = []
ws = []
sse = []
ipc = ["ws"]
jsonrpc = []

[dependencies]
agena = { workspace = true }
agena-api = { workspace = true }
agena-plugin-marketplace = { workspace = true }
agena-scheduler = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["ws", "macros"] }
base64 = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
path-clean = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sea-orm = { workspace = true }
semver = { workspace = true }
smol_str = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "io-util"] }
tokio-stream = { workspace = true, features = ["sync"] }
tower = { workspace = true, features = ["util"] }
tracing = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
