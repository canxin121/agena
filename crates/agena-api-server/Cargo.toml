[package]
name = "agena-api-server"
version = "0.1.0"
edition = "2024"

[dependencies]
agena = { path = "../agena" }
agena-api = { path = "../agena-api" }
async-trait = "0.1.89"
axum = { version = "0.8.6", features = ["ws", "macros"] }
chrono = { version = "0.4.42", features = ["serde"] }
futures-util = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
smol_str = { version = "0.3.2", features = ["serde"] }
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "io-util"] }
tokio-stream = { version = "0.1.16", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1.44"
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[dev-dependencies]
sea-orm = { version = "1.1.19", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-json"] }
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "test-util"] }
tower = { version = "0.5", features = ["util"] }
hyper = "1.5"
http-body-util = "0.1"
