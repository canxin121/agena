[package]
name = "agena-api-server"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
agena = { path = "../agena" }
agena-api = { path = "../agena-api" }
agena-scheduler = { path = "../agena-scheduler" }
async-stream = "0.3.6"
axum = { workspace = true, features = ["ws", "macros"] }
base64 = "0.22.1"
chrono = { workspace = true }
futures-util = "0.3.31"
path-clean = "1.0.1"
serde = { workspace = true }
serde_json = { workspace = true }
sea-orm = { version = "1.1.19", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-json"] }
smol_str = { version = "0.3.2", features = ["serde"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "io-util"] }
tokio-stream = { version = "0.1.16", features = ["sync"] }
tower = { workspace = true, features = ["util"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
sea-orm = { version = "1.1.19", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-json"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tower = { workspace = true, features = ["util"] }
hyper = { workspace = true }
http-body-util = "0.1"

[lints]
workspace = true
