[package]
name = "agena-api-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
[features]
default = ["http", "ws", "sse", "ipc", "jsonrpc"]
http = []
ws = []
sse = []
ipc = ["ws"]
jsonrpc = []

[dependencies]
agena-application = { workspace = true }
agena-api = { workspace = true }
agena-failure = { workspace = true }
agena-domain = { workspace = true }
agena-notification = { workspace = true }
agena-provider = { workspace = true }
agena-runtime-notifications = { workspace = true }
agena-runtime = { workspace = true }
agena-storage = { workspace = true }
agena-plugin-host = { workspace = true }
agena-plugin-marketplace = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["ws", "macros"] }
chrono = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
smol_str = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "io-util"] }
tokio-stream = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
agena-client = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls", "stream"] }
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true }
tower = { workspace = true }
