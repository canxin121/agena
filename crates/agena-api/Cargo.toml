[package]
name = "agena-api"
version = "0.1.0"
edition = "2024"

[dependencies]
agena = { path = "../agena" }
agena-event = { path = "../agena-event" }
chrono = { version = "0.4.42", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
smol_str = { version = "0.3.2", features = ["serde"] }
thiserror = "2.0.18"
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[dev-dependencies]
serde_json = "1.0.149"
