[package]
name = "agena-app-server"
version = "0.1.0"
edition = "2024"

[dependencies]
agena-app-server-protocol = { path = "../agena-app-server-protocol" }
async-trait = "0.1.89"
chrono = { version = "0.4.42", features = ["serde"] }
axum = { version = "0.8.6", features = ["ws"] }
futures-util = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["io-util", "macros", "rt-multi-thread", "sync"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.50.0", features = ["full"] }
