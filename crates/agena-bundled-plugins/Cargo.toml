[package]
name = "agena-bundled-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Agena's bundled plugin implementations and factory registrations"

[dependencies]
agena-skills = { workspace = true }
agena-assistant = { workspace = true }
anyhow = { workspace = true }
agena-storage-layout = { workspace = true }
agena-async = { workspace = true }
portable-atomic = { workspace = true }
agena-failure = { workspace = true }
agena-domain = { workspace = true }
agena-macros = { workspace = true }
agena-mcp-client = { workspace = true }
agena-memory-index = { workspace = true }
agena-plugin-host = { workspace = true }
agena-plugin-sdk = { workspace = true }
agena-provider = { workspace = true }
agena-process = { workspace = true }
agena-runtime-config = { workspace = true }
agena-runtime-contracts = { workspace = true }
agena-runtime-plugins = { workspace = true }
agena-runtime-tools = { workspace = true }
agena-storage = { workspace = true }
agena-tool = { workspace = true }
agena-web = { workspace = true }
agena-agent-browser = { workspace = true }
aes = "0.8.4"
async-trait = { workspace = true }
base64 = { workspace = true }
cbc = "0.1.2"
chrono = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
hmac = "0.13.0"
image = { workspace = true }
ipnet = { workspace = true }
moka = { workspace = true }
regex = { workspace = true }
viperjs = { workspace = true }
which = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "multipart", "stream"] }
rmcp = { workspace = true, features = ["client", "transport-async-rw"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = "2.6.1"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }

[features]
default = []
plugin-wasm = ["agena-plugin-host/wasm"]
plugin-signing = ["agena-plugin-host/signing"]

[build-dependencies]
sha2 = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
agena-storage-sqlite = { workspace = true }
tar = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
