[package]
name = "agena-git-http"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Agena Git HTTP vertical slice"

[dependencies]
agena-failure = { workspace = true }
agena-process = { workspace = true }
axum = { workspace = true, features = ["macros"] }
async-stream = { workspace = true }
base64 = { workspace = true }
dashmap = { workspace = true }
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
ignore = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tempfile = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
walkdir = { workspace = true }
urlencoding = "2.1.3"

[lints]
workspace = true
