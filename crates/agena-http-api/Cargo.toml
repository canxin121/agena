[package]
name = "agena-http-api"
version = "0.1.0"
edition = "2024"

[dependencies]
agena = { path = "../agena" }
async-stream = "0.3.6"
axum = "0.8.6"
base64 = "0.22.1"
clap = { version = "4.5.51", features = ["derive", "env"] }
chrono = { version = "0.4.42", features = ["serde"] }
futures-core = "0.3.31"
path-clean = "1.0.1"
sea-orm = { version = "1.1.19", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }

[dev-dependencies]
async-trait = "0.1.89"
futures-util = "0.3.31"
tower = { version = "0.5.2", features = ["util"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
