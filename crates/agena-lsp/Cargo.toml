[package]
name = "agena-lsp"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
dashmap = "6.1.0"
futures-util = "0.3.31"
lsp-types = "0.97"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time"] }
tracing = "0.1.44"
url = "2.5.4"
arc-swap = "1.7.1"

[features]
default = []
test-support = []

[dev-dependencies]
agena-lsp = { path = ".", features = ["test-support"] }
tokio = { version = "1.50.0", features = ["full", "test-util"] }
