[package]
name = "agena-mcp-client"
version = "0.1.0"
edition = "2024"

[dependencies]
arc-swap = "1.7.1"
async-trait = "0.1.89"
bytes = "1.11.1"
dashmap = "6.1.0"
eventsource-stream = "0.2.3"
futures-util = "0.3.31"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time"] }
tracing = "0.1.44"
url = "2.5.4"
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1.50.0", features = ["full", "test-util"] }
