[package]
name = "agena-mcp-server"
version = "0.1.0"
edition = "2024"

[dependencies]
agena-mcp-client = { path = "../agena-mcp-client" }
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["io-util", "macros", "rt-multi-thread"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.50.0", features = ["full"] }
