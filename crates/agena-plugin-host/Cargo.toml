[package]
name = "agena-plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
[dependencies]
agena-plugin-sdk = { workspace = true, features = ["cdylib", "stdio", "http"] }
abi_stable = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "io-util", "process", "sync", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true }
dashmap = { workspace = true }
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }

[features]
default = []
wasm = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:sha2", "dep:hex"]
signing = ["dep:sha2", "dep:hex", "dep:ed25519-dalek"]

[dev-dependencies]
agena-plugin-sdk = { workspace = true, features = ["http", "stdio"] }
async-trait = { workspace = true }
axum = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
