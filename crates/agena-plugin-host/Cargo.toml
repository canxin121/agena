[package]
name = "agena-plugin-host"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
agena-plugin-sdk = { path = "../agena-plugin-sdk", features = ["cdylib", "stdio", "http"] }
abi_stable = "0.11.3"
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "io-util", "process", "sync", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { workspace = true }
dashmap = "6"
wasmtime = { version = "36.0.7", default-features = false, features = ["cranelift", "runtime", "std"], optional = true }
wasmtime-wasi = { version = "36", default-features = false, features = ["preview1"], optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "pkcs8", "pem"], optional = true }

[features]
default = []
wasm = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:sha2", "dep:hex"]
signing = ["dep:sha2", "dep:hex", "dep:ed25519-dalek"]

[dev-dependencies]
agena-plugin-sdk = { path = "../agena-plugin-sdk", features = ["http", "stdio"] }
async-trait = { workspace = true }
axum = { workspace = true }
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
hex = "0.4"
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
