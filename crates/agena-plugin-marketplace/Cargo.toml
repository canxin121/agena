[package]
name = "agena-plugin-marketplace"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
agena-plugin-host = { path = "../agena-plugin-host", features = ["signing"] }
chrono = { workspace = true }
flate2 = "1"
hex = "0.4"
reqwest = { workspace = true, features = ["blocking", "rustls"] }
semver = { version = "1", features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tar = "0.4"
thiserror = { workspace = true }
toml_edit = "0.23"
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
