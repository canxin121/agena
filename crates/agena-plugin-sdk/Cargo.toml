[package]
name = "agena-plugin-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Agena plugin SDK: write plugins as async traits, ship them as in-process / cdylib / stdio / http."
[dependencies]
agena-domain = { workspace = true }
agena-failure = { workspace = true }
agena-macros = { workspace = true }
agena-tool = { workspace = true }
async-trait = { workspace = true }
bitflags = { workspace = true }
indexmap = { workspace = true }
regex = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
url = { workspace = true }
uuid = { workspace = true }

abi_stable = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "rustls"], optional = true }

[features]
default = []
cdylib = ["dep:abi_stable", "tokio/rt-multi-thread", "tokio/macros"]
stdio = ["tokio/rt-multi-thread", "tokio/macros", "tokio/io-util", "tokio/io-std"]
http = ["tokio/rt-multi-thread", "tokio/macros", "dep:axum", "dep:reqwest"]

[dev-dependencies]
trybuild = "1.0"

# Trybuild copies the workspace's source patches into its generated fixture
# workspace. Keep those patches resolvable there without compiling unrelated
# dependencies into the UI fixtures, otherwise Cargo reports every valid patch
# as unused before the compile-test suite starts.
[target.'cfg(any())'.dev-dependencies]
proc-macro-error2 = "=2.0.1"
ratatui-image = { version = "=11.0.6", default-features = false, features = ["crossterm"] }
ratex-unicode-font = "=0.1.13"

[lints]
workspace = true
