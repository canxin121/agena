[package]
name = "agena-plugin-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Agena plugin SDK: write plugins as async traits, ship them as in-process / cdylib / stdio / http."
[dependencies]
async-trait = { workspace = true }
bitflags = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }

abi_stable = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "rustls"], optional = true }

[features]
default = []
cdylib = ["dep:abi_stable", "tokio/rt-multi-thread", "tokio/macros"]
stdio = ["tokio/rt-multi-thread", "tokio/macros", "tokio/io-util", "tokio/io-std", "dep:tokio-util"]
http = ["tokio/rt-multi-thread", "tokio/macros", "dep:axum", "dep:hyper", "dep:reqwest"]

[lints]
workspace = true
