[package]
name = "agena-plugin-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Agena plugin SDK: write plugins as async traits, ship them as in-process / cdylib / stdio / http."
[dependencies]
agena-async = { workspace = true }
portable-atomic = { workspace = true }
agena-domain = { workspace = true }
agena-failure = { workspace = true }
agena-macros = { workspace = true }
agena-plugin-contracts = { workspace = true }
agena-stdio-codec = { workspace = true, optional = true }
async-trait = { workspace = true }
bitflags = { workspace = true }
bytes = { workspace = true, optional = true }
futures-util = { workspace = true, features = ["sink"], optional = true }
regex = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

abi_stable = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "rustls"], optional = true }

[features]
default = []
cdylib = ["dep:abi_stable", "tokio/rt-multi-thread", "tokio/macros"]
stdio = ["dep:agena-stdio-codec", "dep:bytes", "dep:futures-util", "tokio-util/codec", "tokio/rt-multi-thread", "tokio/macros", "tokio/io-util", "tokio/io-std", "tokio/time"]
http = ["tokio/rt-multi-thread", "tokio/macros", "tokio/time", "dep:axum", "dep:reqwest"]

[lints]
workspace = true
