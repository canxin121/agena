[package]
name = "agena-plugin-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Agena plugin SDK: write plugins as async traits, ship them as in-process / cdylib / stdio / http."
[dependencies]
portable-atomic = { workspace = true }
agena-domain = { workspace = true }
agena-failure = { workspace = true }
agena-macros = { workspace = true }
agena-plugin-contracts = { workspace = true }
agena-stdio-codec = { workspace = true, optional = true }
async-trait = { workspace = true }
bitflags = { workspace = true }
bytes = { workspace = true, optional = true }
futures-util = { workspace = true, features = ["sink"], optional = true }
regex = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tokio-util = { workspace = true, features = ["codec"], optional = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

abi_stable = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "rustls"], optional = true }

[features]
default = []
cdylib = ["dep:abi_stable", "tokio/rt-multi-thread", "tokio/macros"]
stdio = ["dep:agena-stdio-codec", "dep:bytes", "dep:futures-util", "dep:tokio-util", "tokio/rt-multi-thread", "tokio/macros", "tokio/io-util", "tokio/io-std", "tokio/time"]
http = ["tokio/rt-multi-thread", "tokio/macros", "dep:axum", "dep:reqwest"]

[dev-dependencies]
trybuild = "1.0"

# Trybuild copies the workspace's source patches into its generated fixture
# workspace. Keep those patches resolvable there without compiling unrelated
# dependencies into the UI fixtures, otherwise Cargo reports every valid patch
# as unused before the compile-test suite starts.
[target.'cfg(any())'.dev-dependencies]
fs4 = "=0.13.1"
jsonschema = "=0.47.0"
nix = "=0.28.0"
notify = "=8.2.0"
proc-macro-error2 = "=2.0.1"
prometheus = "=0.14.0"
ratatui-image = { version = "=11.0.6", default-features = false, features = ["crossterm"] }
ratex-unicode-font = "=0.1.13"
rmcp = "=3.1.3"
spider_fingerprint = "=2.39.0"
tantivy = "=0.26.1"
term-maths = "=1.0.0"
tower-http = "=0.7.0"
tree-sitter = "=0.26.12"

[lints]
workspace = true
