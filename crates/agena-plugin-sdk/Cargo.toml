[package]
name = "agena-plugin-sdk"
version = "0.1.0"
edition = "2024"
description = "Agena plugin SDK: write plugins as async traits, ship them as in-process / cdylib / stdio / http."

[dependencies]
async-trait = "0.1.89"
bitflags = "2.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["sync"] }
tracing = "0.1.44"

abi_stable = { version = "0.11.3", optional = true }
tokio-util = { version = "0.7", optional = true }
axum = { version = "0.7", optional = true }
hyper = { version = "1.0", optional = true }

[features]
default = []
cdylib = ["dep:abi_stable", "tokio/rt-multi-thread", "tokio/macros"]
stdio = ["tokio/rt-multi-thread", "tokio/macros", "tokio/io-util", "tokio/io-std", "dep:tokio-util"]
http = ["tokio/rt-multi-thread", "tokio/macros", "dep:axum", "dep:hyper"]
