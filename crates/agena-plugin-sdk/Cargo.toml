[package]
name = "agena-plugin-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Agena plugin SDK: write plugins as async traits, ship them as in-process / cdylib / stdio / http."
[dependencies]
agena-macros = { workspace = true }
async-trait = { workspace = true }
bitflags = { workspace = true }
indexmap = { workspace = true }
regex = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
url = { workspace = true }
uuid = { workspace = true }

abi_stable = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "rustls"], optional = true }

[features]
default = []
cdylib = ["dep:abi_stable", "tokio/rt-multi-thread", "tokio/macros"]
stdio = ["tokio/rt-multi-thread", "tokio/macros", "tokio/io-util", "tokio/io-std"]
http = ["tokio/rt-multi-thread", "tokio/macros", "dep:axum", "dep:reqwest"]

[dev-dependencies]
trybuild = "1.0"

[lints]
workspace = true
