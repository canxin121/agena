[package]
name = "agena-process"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Cross-platform Tokio subprocess lifecycle policy for Agena"

[dependencies]
portable-pty = { workspace = true }
libc = { workspace = true }
process-wrap = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process", "rt", "time"] }
tracing = { workspace = true }

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
