[package]
name = "agena-process"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Cross-platform Tokio subprocess lifecycle policy for Agena"

[dependencies]
agena-async = { workspace = true }
agena-domain = { workspace = true }
base64 = { workspace = true }
mxc-sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }
which = { workspace = true }
portable-pty = { workspace = true }
libc = { workspace = true }
process-wrap = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["io-util", "process", "rt", "sync", "time"] }
tracing = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }
