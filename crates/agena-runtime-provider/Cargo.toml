[package]
name = "agena-runtime-provider"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Concrete Agena provider adapters and registry"

[dependencies]
agena-domain = { workspace = true }
agena-provider = { workspace = true }
agena-plugin-host = { workspace = true }
agena-provider-bedrock-auth = { workspace = true }
agena-provider-bedrock-signing = { workspace = true }
agena-provider-bedrock-streaming = { workspace = true }
agena-provider-google-auth = { workspace = true }
agena-runtime-config = { workspace = true }
agena-runtime-contracts = { workspace = true }
agena-runtime-tools = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
hex = { workspace = true }
oauth2 = { workspace = true }
os_info = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { workspace = true }
