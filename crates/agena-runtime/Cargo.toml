[package]
name = "agena-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Runtime primitives and concrete application composition"

[dependencies]
arc-swap = { workspace = true }
base64 = { workspace = true }
agena-provider = { workspace = true }
agena-provider-bedrock-auth = { workspace = true }
agena-provider-bedrock-signing = { workspace = true }
agena-provider-bedrock-streaming = { workspace = true }
agena-provider-google-auth = { workspace = true }
agena-web = { workspace = true }
agena-domain = { workspace = true }
agena-storage = { workspace = true }
agena-storage-sqlite = { workspace = true }
agena-scheduler = { workspace = true }
agena-plugin-host = { workspace = true }
agena-plugin-sdk = { workspace = true }
agena-mcp-client = { workspace = true }
agena-lsp = { workspace = true }
agena-tool = { workspace = true }
agena-keyring-store = { workspace = true }
agena-macros = { workspace = true }
agena-memory-index = { workspace = true }
agena-skills = { workspace = true }
async-trait = { workspace = true }
async-stream = { workspace = true }
blake3 = { workspace = true }
derive_more = { workspace = true, features = ["display", "from", "into"] }
diff = "0.1.13"
futures-util = { workspace = true }
futures-core = { workspace = true }
globset = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
html_escape = { workspace = true }
http = { workspace = true }
imagesize = { workspace = true }
indexmap = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
merge = { workspace = true }
mime_guess = { workspace = true }
parking_lot = { workspace = true }
path-clean = { workspace = true }
os_info = { workspace = true }
oauth2 = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
schemars = { workspace = true }
sea-orm = { workspace = true }
sha2 = { workspace = true }
shlex = { workspace = true }
smol_str = { workspace = true }
strum = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tokio-tungstenite = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
walkdir = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "registry"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = ["schema-lab"]
schema-lab = []
plugin-wasm = ["agena-plugin-host/wasm"]
plugin-signing = ["agena-plugin-host/signing"]

[lints]
workspace = true
