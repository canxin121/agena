[package]
name = "agena-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Runtime primitives and concrete application composition"

[dependencies]
arc-swap = { workspace = true }
base64 = { workspace = true }
agena-provider = { workspace = true }
agena-domain = { workspace = true }
agena-failure = { workspace = true }
agena-runtime-contracts = { workspace = true }
agena-runtime-config = { workspace = true }
agena-runtime-provider = { workspace = true }
agena-runtime-provider-adapters = { workspace = true }
agena-runtime-tools = { workspace = true }
agena-runtime-plugins = { workspace = true }
agena-bundled-plugins = { workspace = true }
agena-runtime-session = { workspace = true }
agena-storage = { workspace = true }
agena-storage-sqlite = { workspace = true }
agena-scheduler = { workspace = true }
agena-plugin-host = { workspace = true }
agena-plugin-sdk = { workspace = true }
agena-mcp-client = { workspace = true }
agena-lsp = { workspace = true }
agena-tool = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
futures-util = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
html_escape = { workspace = true }
http = { workspace = true }
infer = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
oauth2 = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
sea-orm = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
uuid = { workspace = true }
url = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "registry"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = []
plugin-wasm = ["agena-plugin-host/wasm"]
plugin-signing = ["agena-plugin-host/signing"]

[lints]
workspace = true
