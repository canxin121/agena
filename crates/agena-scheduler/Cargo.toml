[package]
name = "agena-scheduler"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.42", features = ["serde"] }
cron = "0.16.0"
parking_lot = "0.12.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[dev-dependencies]
async-trait = "0.1.89"
parking_lot = "0.12.5"
tempfile = "3.23.0"
tokio = { version = "1.50.0", features = ["full", "test-util"] }
