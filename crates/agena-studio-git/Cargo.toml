[package]
name = "agena-studio-git"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Agena Studio Git HTTP vertical slice"

[dependencies]
axum = { workspace = true, features = ["macros"] }
async-stream = { workspace = true }
base64 = { workspace = true }
dashmap = { workspace = true }
getrandom = { workspace = true }
git2 = { version = "0.21.0", default-features = false, features = ["ssh", "https", "vendored-libgit2", "vendored-openssl"] }
ignore = { workspace = true }
libc = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tempfile = { workspace = true }
tracing = { workspace = true }
walkdir = { workspace = true }
urlencoding = "2.1.3"

[lints]
workspace = true
