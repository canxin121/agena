[package]
name = "agena-testkit"
readme = "README.md"
description = "Real Agena system fixtures for ordinary Rust integration tests"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
agena-api = { workspace = true }
agena-client = { workspace = true }
agena-domain = { workspace = true }
agena-failure = { workspace = true }
agena-process = { workspace = true }
anyhow = { workspace = true }
async-stream = { workspace = true }
axum = { workspace = true, features = ["ws"] }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
reqwest = { workspace = true, features = ["json", "query", "rustls", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["rt"] }
tower = { workspace = true, features = ["util"] }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
agena-provider-bedrock-streaming = { workspace = true }
tokio-tungstenite = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lints]
workspace = true
