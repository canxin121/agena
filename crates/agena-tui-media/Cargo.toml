[package]
name = "agena-tui-media"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Media, image, SVG, and mathematical rendering for Agena's TUI"

[features]
test-support = []

[dependencies]
portable-atomic = { workspace = true }
agena-tui = { workspace = true }
agena-tui-components = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
imagesize = { workspace = true }
pulldown-latex = { workspace = true }
ratatui = { workspace = true }
ratatui-image = { workspace = true }
ratex-layout = { workspace = true }
ratex-parser = { workspace = true }
ratex-render = { workspace = true }
ratex-types = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
resvg = { workspace = true }
roxmltree = { workspace = true }
rust-latex-parser = { workspace = true }
term-maths = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
unicode-width = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
