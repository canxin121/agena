[package]
name = "agena-tui-transcript"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Transport-neutral transcript presentation and interaction state"

[dependencies]
agena-api = { workspace = true }
agena-failure = { workspace = true }
agena-domain = { workspace = true }
agena-plugin-sdk = { workspace = true }
agena-tui = { workspace = true }
agena-tui-components = { workspace = true }
agena-tui-media = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
comrak = { workspace = true }
ratatui = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
syntect = { workspace = true }
textwrap = { workspace = true }
tui-markdown = { version = "0.3.8", default-features = false }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
agena-tui-media = { workspace = true, features = ["test-support"] }
image = { workspace = true }
