[package]
name = "agena-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
agena-failure = { workspace = true }
agena-process = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
dom_smoothie = { workspace = true }
dom_query = { workspace = true }
htmd = { workspace = true }
futures-util = { workspace = true }
encoding_rs = { workspace = true }
governor = { workspace = true }
moka = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "cookies", "form"] }
redb = { workspace = true }
robotstxt = { workspace = true }
schemars = { workspace = true }
scraper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
simhash = { workspace = true }
spider = { workspace = true }
text-splitter = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
url = { workspace = true, features = ["serde"] }
urlencoding = { workspace = true }
which = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(target_endian = "little")'.dependencies]
tantivy = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(all(any(target_os = "linux", target_os = "macos", target_os = "windows"), any(target_arch = "aarch64", target_arch = "x86_64")))'.dependencies]
spider = { workspace = true, features = ["chrome", "chrome_headless_new"] }
