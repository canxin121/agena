[package]
name = "agena"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
[dependencies]
agena-mcp-client = { workspace = true }
agena-mcp-server = { workspace = true }
agena-lsp = { workspace = true }
agena-otel = { workspace = true }
agena-keyring-store = { workspace = true }
agena-scheduler = { workspace = true }
agena-skills = { workspace = true }
agena-plugin-host = { workspace = true }
agena-plugin-marketplace = { workspace = true }
arc-swap = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
async-stream = { workspace = true }
aws-config = { workspace = true, default-features = true }
aws-credential-types = { workspace = true }
aws-smithy-eventstream = { workspace = true }
aws-smithy-http = { workspace = true, features = ["event-stream"] }
aws-smithy-types = { workspace = true, features = ["http-body-1-x"] }
aws-sigv4 = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
clap_complete = { workspace = true }
blake3 = { workspace = true }
derive_more = { workspace = true, features = ["display", "from", "into"] }
gcp_auth = { workspace = true }
globset = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
imagesize = { workspace = true }
oauth2 = { workspace = true }
mime_guess = { workspace = true }
path-clean = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls", "stream"] }
html2md = { workspace = true }
lru = { workspace = true }
parking_lot = { workspace = true }
regex = { workspace = true }
html_escape = { workspace = true }
urlencoding = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
schemars = { workspace = true, features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
sha2 = { workspace = true }
smol_str = { workspace = true }
strum = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
mockito = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
plugin-wasm = ["agena-plugin-host/wasm"]
plugin-signing = ["agena-plugin-host/signing"]

[lints]
workspace = true
