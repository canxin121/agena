[package]
name = "agena"
version = "0.1.0"
edition = "2024"

[dependencies]
agena-mcp-client = { path = "../agena-mcp-client" }
agena-plugin-host = { path = "../agena-plugin-host" }
arc-swap = "1.7.1"
chrono = { version = "0.4.42", features = ["serde"] }
async-trait = "0.1.89"
async-stream = "0.3.6"
tokio-stream = { version = "0.1.16", features = ["sync"] }
aws-config = { version = "1.8.15", default-features = true }
aws-credential-types = "1.2.14"
aws-smithy-eventstream = "0.60.20"
aws-smithy-http = { version = "0.63.6", features = ["event-stream"] }
aws-smithy-types = { version = "1.4.7", features = ["http-body-1-x"] }
aws-sigv4 = { version = "1.4.2", default-features = false, features = ["sign-http", "http1"] }
base64 = "0.22.1"
bytes = "1.11.1"
clap = { version = "4.5.51", features = ["derive", "env"] }
blake3 = "1.5"
derive_more = { version = "2.1.1", features = ["display", "from", "into"] }
gcp_auth = "0.12.6"
globset = "0.4.16"
http = "1.3.1"
http-body = "1.0.1"
http-body-util = "0.1.3"
imagesize = "0.13.0"
oauth2 = { version = "4.4.2", default-features = false, features = ["reqwest", "rustls-tls"] }
mime_guess = "2.0.5"
path-clean = "1.0.1"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "stream"] }
html2md = "0.2.15"
lru = "0.16.2"
parking_lot = "0.12.5"
regex = "1.12.2"
html_escape = { package = "html-escape", version = "0.2.13" }
urlencoding = "2.1.3"
procwarden = { git = "https://github.com/canxin121/procwarden.git", rev = "7e878be99167fc0661241cbdb990a9502dda1f22" }
sea-orm = { version = "1.1.19", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-json"] }
sea-orm-migration = { version = "1.1.19", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
schemars = { version = "0.8.21", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
futures-core = "0.3.31"
futures-util = "0.3.31"
sha2 = "0.10.9"
smol_str = { version = "0.3.2", features = ["serde"] }
strum = { version = "0.27.2", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
walkdir = "2.5.0"

[dev-dependencies]
mockito = "1.7.0"

[features]
default = []
plugin-wasm = ["agena-plugin-host/wasm"]
plugin-signing = ["agena-plugin-host/signing"]
