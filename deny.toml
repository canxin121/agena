[graph]
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
unmaintained = "workspace"
unsound = "all"
unused-ignored-advisory = "deny"
ignore = [
    # `rsa` is only pulled by sqlx-mysql; Agena enables sqlite only.
    "RUSTSEC-2023-0071",
    # Tantivy 0.26.1 (current latest) pins lru ^0.16.3, while the panic-safety
    # fix is only available in lru >=0.18.2. Remove this as soon as Tantivy
    # releases a compatible upgrade; unused-ignored-advisory = "deny" makes
    # this exception fail closed once it is no longer needed.
    "RUSTSEC-2026-0253",
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "AGPL-3.0",
    "AGPL-3.0-or-later",
]
confidence-threshold = 0.93
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
