[package]
name = "agena-echo-plugin"
version = "0.2.0"
edition = "2024"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11.3"
agena-plugin-sdk = { path = "../../crates/agena-plugin-sdk", features = ["cdylib"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
