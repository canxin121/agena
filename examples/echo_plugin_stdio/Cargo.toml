[package]
name = "agena-echo-plugin-stdio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "agena-echo-plugin-stdio"
path = "src/main.rs"

[dependencies]
agena-plugin-sdk = { workspace = true, features = ["stdio"] }
async-trait = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util"] }

[lints]
workspace = true

[package.metadata.cargo-machete]
# These names are referenced by SDK re-exports or generated plugin entrypoints.
ignored = ["async-trait", "schemars", "serde", "serde_json", "tokio"]
