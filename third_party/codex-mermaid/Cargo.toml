[package]
name = "codex-mermaid"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Bounded terminal-native Mermaid renderer vendored from openai/codex"

[lib]
name = "codex_mermaid"
path = "src/lib.rs"
doctest = false

[dependencies]
unicode-width = "0.2.2"

[dev-dependencies]
insta = "1"
pretty_assertions = "1"
