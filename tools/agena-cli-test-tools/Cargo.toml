[package]
name = "agena-cli-test-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Internal integration fixtures and real-provider probes for Agena CLI"
publish = false
autobins = false

[[bin]]
name = "dsv4f_mcp_fixture"
path = "src/bin/dsv4f_mcp_fixture.rs"

[[bin]]
name = "dsv4f_tool_api_probe"
path = "src/bin/dsv4f_tool_api_probe.rs"

[[bin]]
name = "dsv4f_tool_api_suite"
path = "src/bin/dsv4f_tool_api_suite.rs"

[dependencies]
agena = { workspace = true }
agena-mcp-client = { workspace = true }
agena-mcp-server = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
